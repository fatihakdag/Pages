# Barrage match relay.
#
#   fly launch --copy-config --no-deploy   (first time: picks a name and region)
#   fly deploy
#
# EXACTLY ONE MACHINE. The relay keeps rooms in an in-memory Map, so a room
# exists only on the machine that created it. With Fly's default of two
# machines for redundancy, connections round-robin and roughly half of all
# joins land on the machine that never heard of the room -- the guest gets
# NO_ROOM and the match cannot start.
#
# One machine is plenty anyway: a turn is one small message and the relay holds
# nothing but room membership. If it ever needs more, the rooms have to move
# out of process memory (or requests be pinned per room with fly-replay);
# scaling up alone will silently break matches.
#
#   fly scale count 1
#   fly deploy --remote-only --ha=false
app = "barrage-relay"
primary_region = "cmh"   # US East (Columbus, Ohio)

[build]

[env]
  PORT = "8080"
  # The relay retires itself after five minutes with nobody connected AND no
  # room being held; auto_start_machines brings it back on the next request.
  # It decides this rather than the platform because only it can see that a
  # room is being kept for someone who might come back — stopping then would
  # destroy it. Set to 0 to keep the machine up permanently.
  IDLE_EXIT_MS = "300000"

[http_service]
  internal_port = 8080
  # The game is served over https, and browsers refuse ws:// from an https://
  # page — so the relay has to be reachable as wss://, which this gives us.
  force_https = true
  auto_start_machines = true
  # The platform's own autostop stays OFF: it once suspended a machine in the
  # middle of a match, on my untested assumption that an open WebSocket counts
  # as activity. It also cannot see that a room is being held for someone who
  # might come back, and stopping then destroys it.
  #
  # Idling down is done by the relay instead, via IDLE_EXIT_MS above -- it
  # knows about both connections and held rooms. auto_start_machines brings it
  # back on the next request, about a second.
  auto_stop_machines = "off"
  min_machines_running = 0
  # See the note at the top: more than one machine breaks joins.
  max_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 100

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

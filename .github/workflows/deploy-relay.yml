# Deploys the match relay to Fly. Nothing needs installing locally: this needs
# only a FLY_API_TOKEN repository secret, created from the Fly dashboard under
# Tokens. Until that secret exists the job fails at the deploy step and nothing
# else is affected.
name: deploy relay

on:
  push:
    branches: [main]
    # Only when the relay or the game it serves actually changes.
    paths:
      - 'multiplayer/server/**'
      - 'multiplayer/index.html'
      - 'multiplayer/Dockerfile'
      - 'multiplayer/fly.toml'
      - '.github/workflows/deploy-relay.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Don't ship a relay whose own tests are failing.
      - name: relay tests
        run: npm --prefix multiplayer/server ci && npm --prefix multiplayer/server test
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --remote-only builds on Fly's builders, so the runner needs no Docker.
      - name: deploy
        # --ha=false: one machine only. Rooms live in memory, so a second
        # machine would serve joins for rooms it does not have.
        run: flyctl deploy --remote-only --ha=false
        working-directory: multiplayer
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      vsCpu: 'vs CPU', allHuman: 'All Human',
      easy: 'Easy', medium: 'Medium', hard: 'Hard', brutal: 'Brutal',
      angleDown: 'Angle down one degree', angleUp: 'Angle up one degree',
      powerDown: 'Power down one', powerUp: 'Power up one',
      'Dusk Ridge': 'Dusk Ridge', 'Salt Flats': 'Salt Flats', 'Ash Peaks': 'Ash Peaks',
      'Glacier': 'Glacier', 'Verdant Hills': 'Verdant Hills',
      'Night Crater': 'Night Crater', 'Rust Canyon': 'Rust Canyon'
    },
    tr: {
      wind: 'RÜZGÂR', angle: 'AÇI', power: 'GÜÇ', weapon: 'SİLAH',
      tanks: 'TANKLAR', opponents: 'RAKİPLER', cpuLevel: 'CPU SEVİYESİ',
      fire: 'ATEŞ', playAgain: 'Tekrar Oyna', build: 'sürüm',
      keysHint: '← → nişan &nbsp;|&nbsp; ↑ ↓ güç &nbsp;|&nbsp; BOŞLUK ateş',
      playerFull: 'OYUNCU {n}', playerAbbr: 'O{n}',
      playerName: 'Oyuncu {n}', cpuName: 'CPU {n}',
      roundOver: 'TUR BİTTİ', inFlight: 'HAVADA…',
      thinking: '{name} DÜŞÜNÜYOR…', aimFire: '{name} — NİŞAN AL & ATEŞ',
      level: 'SEVİYE {n}',
      wins: '{name} kazandı!', everybodyLoses: 'Herkes kaybetti!',
      playAgainHint: 'Yeni arazi ve rövanş için Tekrar Oyna\'ya dokun.',
      w_standard: 'Standart Mermi', w_big: 'Büyük Bomba', w_cluster: 'Misket Bombası',
      unlimited: 'sınırsız', nLeft: '{n} kaldı',
      tanks2: '2 Oyuncu', tanks3: '3 Oyuncu', tanks4: '4 Oyuncu',
      vsCpu: 'CPU\'ya Karşı', allHuman: 'Hepsi İnsan',
      easy: 'Kolay', medium: 'Orta', hard: 'Zor', brutal: 'Acımasız',
      angleDown: 'Açıyı bir derece azalt', angleUp: 'Açıyı bir derece artır',
      powerDown: 'Gücü bir azalt', powerUp: 'Gücü bir artır',
      'Dusk Ridge': 'Alacakaranlık Sırtı', 'Salt Flats': 'Tuz Düzlüğü',
      'Ash Peaks': 'Kül Zirveleri', 'Glacier': 'Buzul',
      'Verdant Hills': 'Yeşil Tepeler', 'Night Crater': 'Gece Krateri',
      'Rust Canyon': 'Pas Kanyonu'
    }
  };

  let lang = 'en';
  // Named txt() rather than t(): `t` is the tank variable all over this file,
  // and a lookup shadowed by a tank object would throw at runtime.
  function txt(key, vars) {
    let s = STRINGS[lang][key];
    if (s === undefined) s = STRINGS.en[key];
    if (s === undefined) return key;
    if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
    return s;
  }

  const MAX_PLAYERS = 4;
  const PLAYER_VARS = ['--accent-p1', '--accent-p2', '--accent-p3', '--accent-p4'];
  const hpFill = [], hpText = [], cards = [], aiBadges = [];
  for (let i = 1; i <= MAX_PLAYERS; i++) {
    hpFill.push(document.getElementById('hp-fill-' + i));
    hpText.push(document.getElementById('hp-text-' + i));
    cards.push(document.getElementById('card-p' + i));
    aiBadges.push(document.getElementById('ai-badge-' + i));
  }

  let cpuMode = modeSelect.value === 'cpu'; // false = every tank is a local human
  let playerCount = parseInt(countSelect.value, 10);
  let aiDifficulty = difficultySelect.value; // 'easy' | 'medium' | 'hard' | 'brutal'

  // Player 1 is always the local human; every other seat is a CPU when enabled.
  function isAi(i) { return cpuMode && i > 0; }
  function playerName(i) { return txt(isAi(i) ? 'cpuName' : 'playerName', { n: i + 1 }); }

  // Remembered so the win overlay can be re-rendered if the language changes
  // while it is on screen.
  let lastWinner = null;
  function refreshOverlayText() {
    if (lastWinner === null) return;
    overlayTitle.textContent = lastWinner === -1
      ? txt('everybodyLoses')
      : txt('wins', { name: playerName(lastWinner) });
    overlaySub.textContent = txt('playAgainHint');
  }

  const langCheckbox = document.getElementById('lang-tr');

  function applyLanguage() {
    document.documentElement.lang = lang;
    for (const el of document.querySelectorAll('[data-i18n]')) {
      el.innerHTML = txt(el.getAttribute('data-i18n'));
    }
    for (let i = 0; i < MAX_PLAYERS; i++) {
      cards[i].querySelector('.pn-full').textContent = txt('playerFull', { n: i + 1 });
      cards[i].querySelector('.pn-abbr').textContent = txt('playerAbbr', { n: i + 1 });
    }
    const relabel = (sel, keys) => {
      for (let i = 0; i < sel.options.length; i++) sel.options[i].textContent = txt(keys[i]);
    };
    relabel(countSelect, ['tanks2', 'tanks3', 'tanks4']);
    relabel(modeSelect, ['vsCpu', 'allHuman']);
    relabel(difficultySelect, ['easy', 'medium', 'hard', 'brutal']);
    const aria = { 'angle-dec': 'angleDown', 'angle-inc': 'angleUp',
                   'power-dec': 'powerDown', 'power-inc': 'powerUp' };
    for (const id in aria) document.getElementById(id).setAttribute('aria-label', txt(aria[id]));
    // the weapon <option> labels and ammo readout are rebuilt from here
    if (tanks.length) { updateHUD(); syncControlsFromTank(); }
    refreshOverlayText();
  }

  langCheckbox.addEventListener('change', () => {
    lang = langCheckbox.checked ? 'tr' : 'en';
    try { localStorage.setItem('barrage.lang', lang); } catch (e) { /* private mode */ }
    applyLanguage();
  });

  function initLanguage() {
    let stored = null;
    try { stored = localStorage.getItem('barrage.lang'); } catch (e) { /* private mode */ }
    const browserTr = (navigator.language || '').toLowerCase().indexOf('tr') === 0;
    lang = (stored === 'tr' || stored === 'en') ? stored : (browserTr ? 'tr' : 'en');
    langCheckbox.checked = lang === 'tr';
    applyLanguage();
  }

  function refreshOpponentUi() {
    // CPU level only matters when playing against the computer
    difficultyGroup.style.display = cpuMode ? '' : 'none';
  }

  modeSelect.addEventListener('change', () => {
    cpuMode = modeSelect.value === 'cpu';
    refreshOpponentUi();
    updateHUD();
    syncControlsFromTank();
    // if we just switched to CPU mid-way through a CPU seat's turn, let it play
    maybeAiTurn();
  });

  // Changing the roster mid-round has no sane continuation — start a fresh round.
  countSelect.addEventListener('change', () => {
    playerCount = parseInt(countSelect.value, 10);
    resetGame();
  });

  difficultySelect.addEventListener('change', () => {
    aiDifficulty = difficultySelect.value;
  });
  weaponSelect.addEventListener('change', () => {
    const remaining = tanks[currentPlayer].ammo[weaponSelect.value];
    ammoReadout.textContent = remaining === Infinity ? txt('unlimited') : txt('nLeft', { n: remaining });
  });

  let W = 0, H = 0, DPR = 1;

  // Tanks are placed at fractions of the width, but the physics below is in
  // absolute pixels, so without this a shot's range would be a fixed pixel
  // distance on every canvas: the same power crosses 72% of a phone screen and
  // 11% of an ultrawide, and past ~1900px the enemy is out of reach at full
  // power. Scaling every length-per-time and length-per-time^2 quantity by the
  // canvas width makes trajectories geometrically similar at any size — the
  // same angle and power always land on the same *relative* spot, and flight
  // times stay put. W_REF is the width the tuning above is expressed in.
  const W_REF = 1000;
  let physScale = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = gameWrap.clientWidth;
    H = gameWrap.clientHeight;
    // Some mobile browsers report 0 during early layout / orientation change.
    // Falling through with 0 would produce a blank canvas with no error.
    if (!W || !H) {
      const r = gameWrap.getBoundingClientRect();
      W = Math.round(r.width) || window.innerWidth || 320;
      H = Math.round(r.height) || Math.max(160, (window.innerHeight || 480) - 200);
    }
    W = Math.max(160, W);
    H = Math.max(120, H);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const prevScale = physScale;
    physScale = W / W_REF;
    // A shell already in the air was launched under the old scale; rescale it
    // so it keeps flying the arc it was aimed on.
    if (projectile && prevScale > 0) {
      const k = physScale / prevScale;
      projectile.vx *= k;
      projectile.vy *= k;
    }
    if (terrain.length) {
      // Keep tanks at the same relative spot when the canvas changes size,
      // otherwise rotating the device leaves them stranded off-screen.
      const fracs = tanks.map(t => (prevW > 0 ? t.x / prevW : null));
      rebuildTerrainToWidth();
      tanks.forEach((t, i) => {
        if (fracs[i] !== null && isFinite(fracs[i])) {
          t.x = Math.max(20, Math.min(W - 20, fracs[i] * W));
        }
      });
      levelTankPads(); // the rebuild above regenerates terrain from the seed shape
    }
    prevW = W;
  }
  let prevW = 0;

  // ---------- Environments ----------
  // Each level gets a distinct sky, ground palette, and terrain personality.
  const THEMES = [
    {
      name: 'Dusk Ridge',
      skyTop: '#2b3a55', skyBot: '#7d5a6e',
      ground1: '#4a3728', ground2: '#2e2118',
      rim: 'rgba(255,200,150,0.20)',
      decor: 'stars', decorColor: 'rgba(255,255,255,0.25)',
      roughness: 0.56, falloff: 0.62, points: 160, baseLo: 0.33, baseHi: 0.77
    },
    {
      name: 'Salt Flats',
      skyTop: '#8fb8d6', skyBot: '#e8d9b8',
      ground1: '#d9c9a3', ground2: '#8a7a5c',
      rim: 'rgba(255,255,255,0.35)',
      decor: 'clouds', decorColor: 'rgba(255,255,255,0.5)',
      roughness: 0.22, falloff: 0.52, points: 200, baseLo: 0.47, baseHi: 0.76
    },
    {
      name: 'Ash Peaks',
      skyTop: '#3a2b33', skyBot: '#8c4a35',
      ground1: '#5c4038', ground2: '#241a19',
      rim: 'rgba(255,120,60,0.30)',
      decor: 'embers', decorColor: 'rgba(255,140,60,0.45)',
      roughness: 0.70, falloff: 0.67, points: 140, baseLo: 0.28, baseHi: 0.72
    },
    {
      name: 'Glacier',
      skyTop: '#1d3550', skyBot: '#6fa8bf',
      ground1: '#cfe4ee', ground2: '#6d8ba0',
      rim: 'rgba(255,255,255,0.55)',
      decor: 'snow', decorColor: 'rgba(255,255,255,0.6)',
      roughness: 0.66, falloff: 0.65, points: 150, baseLo: 0.30, baseHi: 0.74
    },
    {
      name: 'Verdant Hills',
      skyTop: '#5aa4d6', skyBot: '#cfe6c8',
      ground1: '#5c8a3c', ground2: '#2c4520',
      rim: 'rgba(200,255,170,0.30)',
      decor: 'clouds', decorColor: 'rgba(255,255,255,0.55)',
      roughness: 0.36, falloff: 0.57, points: 180, baseLo: 0.40, baseHi: 0.76
    },
    {
      name: 'Night Crater',
      skyTop: '#0d1024', skyBot: '#2a1f45',
      ground1: '#3b3550', ground2: '#161327',
      rim: 'rgba(160,150,255,0.30)',
      decor: 'stars', decorColor: 'rgba(220,220,255,0.45)',
      roughness: 0.62, falloff: 0.63, points: 150, baseLo: 0.32, baseHi: 0.76
    },
    {
      name: 'Rust Canyon',
      skyTop: '#7a4a2e', skyBot: '#e0a05a',
      ground1: '#a85a35', ground2: '#4a2418',
      rim: 'rgba(255,180,120,0.30)',
      decor: 'dust', decorColor: 'rgba(255,200,150,0.35)',
      roughness: 0.74, falloff: 0.69, points: 130, baseLo: 0.26, baseHi: 0.70
    }
  ];

  let level = 1;
  let theme = THEMES[0];
  let decorItems = []; // clouds / stars / embers positions for the current theme

  // Relative luminance, so wind streaks can pick a colour that shows up
  // against this theme's sky instead of vanishing into a pale one.
  function hexLum(hex) {
    const h = hex.replace('#', '');
    const r = parseInt(h.slice(0, 2), 16) / 255;
    const g = parseInt(h.slice(2, 4), 16) / 255;
    const b = parseInt(h.slice(4, 6), 16) / 255;
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }

  let streakRGB = '255,255,255';

  function applyTheme(t) {
    theme = t;
    streakRGB = hexLum(t.skyTop) > 0.5 ? '40,34,30' : '255,255,255';
    const root = document.documentElement;
    if (root && root.style) {
      root.style.setProperty('--sky-top', t.skyTop);
      root.style.setProperty('--sky-bot', t.skyBot);
      root.style.setProperty('--ground-1', t.ground1);
      root.style.setProperty('--ground-2', t.ground2);
    }
    buildDecor();
  }

  function buildDecor() {
    decorItems = [];
    const kind = theme.decor;
    if (kind === 'stars') {
      for (let i = 0; i < 70; i++) {
        decorItems.push({ x: Math.random(), y: Math.random() * 0.55, r: Math.random() * 1.4 + 0.5, tw: Math.random() * 6.28 });
      }
    } else if (kind === 'clouds') {
      for (let i = 0; i < 6; i++) {
        decorItems.push({ x: Math.random(), y: 0.08 + Math.random() * 0.3, s: 0.6 + Math.random() * 0.9, drift: 0.004 + Math.random() * 0.008 });
      }
    } else if (kind === 'embers' || kind === 'dust' || kind === 'snow') {
      const count = kind === 'snow' ? 60 : 40;
      for (let i = 0; i < count; i++) {
        decorItems.push({
          x: Math.random(), y: Math.random(),
          r: Math.random() * 1.8 + 0.6,
          vy: (kind === 'snow' ? 0.02 : -0.03) * (0.5 + Math.random()),
          vx: (Math.random() * 2 - 1) * 0.01
        });
      }
    }
  }

  function nextTheme() {
    // advance through environments, avoiding an immediate repeat
    let idx;
    do { idx = Math.floor(Math.random() * THEMES.length); }
    while (THEMES.length > 1 && THEMES[idx] === theme);
    applyTheme(THEMES[idx]);
  }

  // ---------- Terrain ----------
  const GROUND_MARGIN_TOP = 0.35; // terrain never rises above 35% of canvas height
  let terrain = []; // heightmap, index = x pixel, value = y of ground surface
  let terrainSeedShape = []; // normalized 0..1 shape independent of width, resampled on resize

  function generateTerrainShape() {
    // midpoint displacement, tuned per theme so each environment has its own feel
    const n = theme.points;
    const arr = new Array(n);
    arr[0] = theme.baseLo + Math.random() * (theme.baseHi - theme.baseLo);
    arr[n - 1] = theme.baseLo + Math.random() * (theme.baseHi - theme.baseLo);
    function subdivide(lo, hi, roughness) {
      if (hi - lo < 2) return;
      const mid = Math.floor((lo + hi) / 2);
      const avg = (arr[lo] + arr[hi]) / 2;
      arr[mid] = avg + (Math.random() * 2 - 1) * roughness;
      arr[mid] = Math.max(0.05, Math.min(0.85, arr[mid]));
      subdivide(lo, mid, roughness * theme.falloff);
      subdivide(mid, hi, roughness * theme.falloff);
    }
    subdivide(0, n - 1, theme.roughness);
    return arr;
  }

  function rebuildTerrainToWidth() {
    const n = terrainSeedShape.length;
    terrain = new Array(Math.ceil(W));

    // Terrain relief used to be a flat fraction of H, so a short (landscape)
    // canvas produced almost flat ground. Scale the vertical span against the
    // canvas aspect instead: wide-and-short viewports get proportionally more
    // relief so hills keep the same *shape* they'd have in portrait.
    const aspect = W / Math.max(1, H);
    // 1.0 at a squarish 4:3 view, growing (capped) as the view gets wider
    const reliefBoost = Math.min(1.55, Math.max(1, Math.sqrt(aspect / 1.33)));
    const usableSpan = H * (1 - GROUND_MARGIN_TOP - 0.03);
    const span = Math.min(usableSpan * reliefBoost, H * 0.72);
    const top = Math.max(H * 0.06, H - H * 0.05 - span);

    for (let x = 0; x < W; x++) {
      const t = (x / (W - 1)) * (n - 1);
      const i0 = Math.floor(t);
      const i1 = Math.min(n - 1, i0 + 1);
      const f = t - i0;
      const shapeVal = terrainSeedShape[i0] * (1 - f) + terrainSeedShape[i1] * f;
      const y = top + shapeVal * span;
      terrain[x] = Math.min(Math.max(y, H * 0.06), H - TANK_H - 6);
    }
  }

  function newTerrain() {
    terrainSeedShape = generateTerrainShape();
    rebuildTerrainToWidth();
  }

  // Craters dig downward; without a floor, repeated hits in one spot push the
  // ground (and any tank resting on it) below the bottom of the canvas.
  function bedrockY() {
    return H - TANK_H - 6; // deepest the ground is allowed to go, keeping tanks visible
  }

  function craterAt(cx, groundY, radius) {
    // carve a circular crater into terrain heightmap
    const rSq = radius * radius;
    const floor = bedrockY();
    const xStart = Math.max(0, Math.floor(cx - radius));
    const xEnd = Math.min(terrain.length - 1, Math.ceil(cx + radius));
    for (let x = xStart; x <= xEnd; x++) {
      const dx = x - cx;
      const dySq = rSq - dx * dx;
      if (dySq < 0) continue;
      const dy = Math.sqrt(dySq);
      const craterBottom = Math.min(groundY + dy, floor); // clamp to bedrock
      if (craterBottom > terrain[x]) {
        terrain[x] = craterBottom;
      }
    }
  }

  function groundHeightAt(x) {
    const xi = Math.max(0, Math.min(terrain.length - 1, Math.round(x)));
    return terrain[xi];
  }

  // ---------- Game state ----------
  const GRAVITY = 340; // px/s^2
  const TANK_W = 26, TANK_H = 14;
  const MAX_HP = 100;

  let tanks = [];

  function getVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  let wind = 0; // px/s^2 lateral accel
  let windPulse = 0; // 1 -> 0 flash right after the wind changes
  let currentPlayer = 0;
  let state = 'AIMING'; // AIMING | FIRING | EXPLODING | GAMEOVER
  let projectile = null;
  let trail = [];
  let explosions = []; // active explosion animations {x,y,r,maxR,t}
  let clusterQueue = []; // pending sub-explosions for cluster bomb
  let particles = [];

  const WEAPONS = {
    standard: { radius: 26, damageMax: 34, color: '#ffcf5c', label: 'Standard Shell', startAmmo: Infinity },
    big:      { radius: 46, damageMax: 55, color: '#ff7a45', label: 'Big Bomb', startAmmo: 5 },
    cluster:  { radius: 18, damageMax: 22, color: '#ff5c9c', label: 'Cluster Bomb', clusterCount: 5, startAmmo: 3 }
  };

  function freshAmmo() {
    const a = {};
    for (const key in WEAPONS) a[key] = WEAPONS[key].startAmmo;
    return a;
  }

  function buildTanks() {
    tanks = [];
    for (let i = 0; i < playerCount; i++) {
      tanks.push({ x: 0, hp: MAX_HP, color: getVar(PLAYER_VARS[i]), alive: true, angle: 45, power: 50, ammo: freshAmmo() });
    }
  }

  // One slot per tank across the width, jittered inside it, so 2, 3 or 4 tanks
  // all start well spaced instead of piling up at the edges.
  function placeTanks() {
    const slot = 1 / tanks.length;
    tanks.forEach((t, i) => {
      const frac = (i + 0.2 + Math.random() * 0.6) * slot;
      t.x = Math.max(24, Math.min(W - 24, W * frac));
      t.angle = t.x < W / 2 ? 45 : 135; // start aimed toward the middle of the map
      t.power = 50;
    });
    levelTankPads();
  }

  // A tank is drawn as a flat rectangle, so on the steeper terrain it now sits
  // on it would bury one end in the hillside. Ease a short level pad under each
  // one; the quadratic falloff blends it into the surrounding slope.
  function levelTankPads() {
    if (!terrain.length) return;
    const pad = TANK_W;
    for (const t of tanks) {
      const y = groundHeightAt(t.x);
      const x0 = Math.max(0, Math.round(t.x - pad));
      const x1 = Math.min(terrain.length - 1, Math.round(t.x + pad));
      for (let x = x0; x <= x1; x++) {
        const d = Math.min(1, Math.abs(x - t.x) / pad);
        const w = 1 - d * d;
        terrain[x] = terrain[x] * (1 - w) + y * w;
      }
    }
  }

  // Lateral accel, against GRAVITY of 340. Drift over a shot works out to
  // (wind / GRAVITY) * tan(angle) * range. At 60 a max-wind 45° shot moved the
  // shell under two tank widths — inside the blast radius, so wind was
  // ignorable. 120 overshot the other way and made every round a fight against
  // the weather. 80 puts a typical shot's drift at ~1.3 tank widths and a
  // worst case at ~2.6: worth aiming off for, not worth dreading.
  const WIND_MAX = 80;
  function windStrength() { return Math.min(1, Math.abs(wind) / WIND_MAX); }
  // px/s^2 is an internal unit and only means anything next to GRAVITY, so it
  // is never shown. Players get a 0-10 force instead; 0 reads as calm.
  function windForce() { return Math.round(windStrength() * 10); }
  function windColor() {
    const s = windStrength();
    if (s > 0.58) return '#ff6b6b';
    if (s > 0.28) return '#ffc44d';
    return '#8fe3a8';
  }

  function setWind() {
    wind = (Math.random() * 2 - 1) * WIND_MAX;
    const col = windColor();
    windVal.textContent = windForce() + '/10';
    windArrow.textContent = wind >= 0 ? '→' : '←';
    windArrow.style.color = col;
    windVal.style.color = col;
    windPulse = 1; // flash the on-canvas gauge so a new wind isn't missed
  }

  function resetGame() {
    buildTanks();
    currentPlayer = 0;
    state = 'AIMING';
    projectile = null;
    trail = [];
    explosions = [];
    particles = [];
    clusterQueue = [];
    heli = null;
    nextTheme();
    newTerrain();
    placeTanks();
    setWind();
    updateHUD();
    overlay.classList.remove('show');
    syncControlsFromTank();
    maybeAiTurn();
  }

  function updateHUD() {
    for (let i = 0; i < MAX_PLAYERS; i++) {
      const t = tanks[i];
      cards[i].hidden = !t;
      if (!t) continue;
      const pct = Math.max(0, t.hp / MAX_HP * 100);
      hpFill[i].style.width = pct + '%';
      hpText[i].textContent = `${Math.max(0, Math.round(t.hp))} / ${MAX_HP}`;
      cards[i].classList.toggle('active', currentPlayer === i && state === 'AIMING');
      cards[i].classList.toggle('dead', !t.alive);
      aiBadges[i].style.display = isAi(i) ? 'inline-block' : 'none';
    }
    if (state === 'GAMEOVER') {
      turnBanner.textContent = txt('roundOver');
    } else if (state !== 'AIMING') {
      turnBanner.textContent = txt('inFlight');
    } else {
      const who = playerName(currentPlayer).toUpperCase();
      turnBanner.textContent = txt(isAi(currentPlayer) ? 'thinking' : 'aimFire', { name: who });
    }
    levelInfo.textContent = `${txt('level', { n: level })} · ${txt(theme.name)} · ${BUILD}`;
  }

  function syncControlsFromTank() {
    const t = tanks[currentPlayer];
    angleSlider.value = t.angle;
    powerSlider.value = t.power;
    angleVal.textContent = t.angle + '°';
    powerVal.textContent = t.power;
    const isAiTurn = isAi(currentPlayer);
    fireBtn.disabled = (state !== 'AIMING') || isAiTurn;
    angleSlider.disabled = isAiTurn;
    powerSlider.disabled = isAiTurn;
    nudgeBtns.forEach(b => { b.disabled = isAiTurn; });
    syncWeaponOptions(t);
  }

  function syncWeaponOptions(t) {
    for (const opt of weaponSelect.options) {
      const key = opt.value;
      const remaining = t.ammo[key];
      const label = txt('w_' + key);
      opt.textContent = remaining === Infinity ? `${label} (∞)` : `${label} (${remaining})`;
      opt.disabled = remaining <= 0;
    }
    // if the currently selected weapon just ran dry, fall back to standard
    if (t.ammo[weaponSelect.value] <= 0) {
      weaponSelect.value = 'standard';
    }
    const cur = weaponSelect.value;
    const curRemaining = t.ammo[cur];
    ammoReadout.textContent = curRemaining === Infinity ? txt('unlimited') : txt('nLeft', { n: curRemaining });
  }

  angleSlider.addEventListener('input', () => {
    tanks[currentPlayer].angle = parseInt(angleSlider.value, 10);
    angleVal.textContent = angleSlider.value + '°';
  });
  powerSlider.addEventListener('input', () => {
    tanks[currentPlayer].power = parseInt(powerSlider.value, 10);
    powerVal.textContent = powerSlider.value;
  });

  // Arrow buttons either side of each slider: a slider alone can't reliably
  // pick one degree out of 180, especially with a fingertip.
  function nudge(which, delta) {
    if (isAi(currentPlayer)) return; // same condition that gates the sliders
    const t = tanks[currentPlayer];
    if (which === 'angle') t.angle = Math.max(0, Math.min(180, t.angle + delta));
    else t.power = Math.max(0, Math.min(100, t.power + delta));
    syncControlsFromTank();
  }

  const nudgeBtns = [], nudgeStops = [];
  function bindNudge(id, which, delta) {
    const btn = document.getElementById(id);
    nudgeBtns.push(btn);
    let holdTimer = null, repeatTimer = null;
    const stop = () => {
      clearTimeout(holdTimer);
      clearInterval(repeatTimer);
      holdTimer = repeatTimer = null;
    };
    nudgeStops.push(stop);
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault(); // don't let a touch turn into a scroll or a zoom
      nudge(which, delta);
      holdTimer = setTimeout(() => {
        repeatTimer = setInterval(() => nudge(which, delta), 55);
      }, 380);
    });
    for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) {
      btn.addEventListener(ev, stop);
    }
    // detail === 0 means the click came from the keyboard, which fires no
    // pointer events at all; without this the buttons would be pointer-only.
    btn.addEventListener('click', (e) => { if (e.detail === 0) nudge(which, delta); });
  }
  bindNudge('angle-dec', 'angle', -1);
  bindNudge('angle-inc', 'angle', 1);
  bindNudge('power-dec', 'power', -1);
  bindNudge('power-inc', 'power', 1);
  // a press held while the tab loses focus would otherwise repeat forever
  window.addEventListener('blur', () => nudgeStops.forEach(fn => fn()));

  window.addEventListener('keydown', (e) => {
    if (state !== 'AIMING' || isAi(currentPlayer)) return;
    const t = tanks[currentPlayer];
    if (e.key === 'ArrowLeft') { t.angle = Math.max(0, t.angle - 1); syncControlsFromTank(); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { t.angle = Math.min(180, t.angle + 1); syncControlsFromTank(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { t.power = Math.min(100, t.power + 2); syncControlsFromTank(); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { t.power = Math.max(0, t.power - 2); syncControlsFromTank(); e.preventDefault(); }
    else if (e.code === 'Space') { fire(); e.preventDefault(); }
  });

  fireBtn.addEventListener('click', fire);
  restartBtn.addEventListener('click', () => { level++; resetGame(); });

  function fire() {
    if (state !== 'AIMING') return;
    const shooter = tanks[currentPlayer];
    let weaponKey = weaponSelect.value;
    if (shooter.ammo[weaponKey] <= 0) weaponKey = 'standard'; // safety fallback, shouldn't normally trigger
    shooter.ammo[weaponKey] -= 1;
    const angleRad = shooter.angle * Math.PI / 180;
    // Angles are in world space for every tank: 0° = due right, 180° = due left.
    const speed = shooter.power * 6.2 * physScale;
    const vx = Math.cos(angleRad) * speed;
    const vy = -Math.sin(angleRad) * speed;
    const barrelLen = 20;
    projectile = {
      x: shooter.x + barrelLen * Math.cos(angleRad),
      y: groundHeightAt(shooter.x) - TANK_H - barrelLen * Math.sin(angleRad),
      vx, vy,
      weapon: weaponKey,
      firedBy: currentPlayer
    };
    trail = [];
    state = 'FIRING';
    updateHUD();
  }

  function applyDamageAndCrater(px, py, weaponKey) {
    const w = WEAPONS[weaponKey];
    // Compute damage using terrain heights BEFORE cratering — otherwise a
    // close/direct hit carves the ground out from under the tank first,
    // which makes the tank look farther from the blast than it really was
    // and under-credits exactly the hits that should do the most damage.
    for (const t of tanks) {
      if (!t.alive) continue;
      const tankTopY = groundHeightAt(t.x) - TANK_H;
      const dx = t.x - px;
      const dy = tankTopY - py;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < w.radius) {
        const falloff = 1 - dist / w.radius;
        const dmg = w.damageMax * falloff;
        t.hp -= dmg;
        if (t.hp <= 0) { t.hp = 0; t.alive = false; }
      }
    }
    craterAt(px, py, w.radius);
    spawnExplosionFx(px, py, w.radius, w.color);
  }

  function spawnExplosionFx(x, y, radius, color) {
    explosions.push({ x, y, r: 4, maxR: radius * 1.15, t: 0, color });
    const count = Math.round(radius * 0.9);
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 40 + Math.random() * 140;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 60,
        life: 0.5 + Math.random() * 0.5,
        age: 0,
        color: Math.random() < 0.5 ? color : '#fff2c9'
      });
    }
  }

  function endTurnCheckWin() {
    const alive = tanks.filter(t => t.alive);
    if (alive.length <= 1) {
      state = 'GAMEOVER';
      lastWinner = tanks.findIndex(tk => tk.alive);
      refreshOverlayText();
      overlay.classList.add('show');
      updateHUD();
      return true;
    }
    return false;
  }

  function nextTurn() {
    if (endTurnCheckWin()) return;
    // at least two tanks are alive here, so this always lands on someone else
    do { currentPlayer = (currentPlayer + 1) % tanks.length; }
    while (!tanks[currentPlayer].alive);
    if (heli) heli.seen.add(currentPlayer); // this player now gets a crack at it
    setWind();
    state = 'AIMING';
    updateHUD();
    syncControlsFromTank();
    maybeAiTurn();
  }

  // ---------- AI: trajectory-solving aim, scaled by difficulty ----------
  // heliChance   - how often it goes for the helicopter at all when one is up
  // heliPatience - how often it holds fire unless the wreck would land on someone
  // heli*Jitter  - absolute aim error for that shot, deliberately far wider than
  //                the tank jitter above, so even Brutal mostly misses a target
  //                this small and moving
  const DIFFICULTY_SETTINGS = {
    easy:    { angleStep: 6, powerStep: 6,  angleJitter: 16, powerJitter: 22, missChance: 0.30, thinkMs: 900,
               heliChance: 0.30, heliPatience: 0.15, heliAngleJitter: 14, heliPowerJitter: 18 },
    medium:  { angleStep: 3, powerStep: 3,  angleJitter: 7,  powerJitter: 10, missChance: 0.12, thinkMs: 750,
               heliChance: 0.30, heliPatience: 0.40, heliAngleJitter: 10, heliPowerJitter: 13 },
    hard:    { angleStep: 1.5, powerStep: 1.5, angleJitter: 3,  powerJitter: 4,  missChance: 0.04, thinkMs: 600,
               heliChance: 0.30, heliPatience: 0.65, heliAngleJitter: 7,  heliPowerJitter: 9 },
    brutal:  { angleStep: 1, powerStep: 1,  angleJitter: 0.5, powerJitter: 1,  missChance: 0,    thinkMs: 450,
               heliChance: 0.30, heliPatience: 0.85, heliAngleJitter: 3,  heliPowerJitter: 4 }
  };

  // Simulates a shot with the same physics as the real game and returns
  // where it would land (x coordinate), so the AI can search for the
  // angle/power combo that actually lands on the target.
  // Set by the last predictLandingX call: the shot stopped on the helicopter
  // rather than on the ground. A module-level flag rather than a returned
  // object because this runs thousands of times per turn.
  let predictHitHeli = false;

  function predictLandingX(x0, y0, angleDeg, power, windAccel) {
    const angleRad = angleDeg * Math.PI / 180;
    let vx = Math.cos(angleRad) * power * 6.2 * physScale;
    let vy = -Math.sin(angleRad) * power * 6.2 * physScale;
    let x = x0, y = y0, t = 0;
    const dt = 0.03;
    predictHitHeli = false;
    // The real shot stops on the airframe, so a prediction that flies straight
    // through it would have the AI picking shots that get intercepted. Bounds
    // are hoisted out of the loop; this is the hottest code in the game.
    const live = heli && !heli.falling;
    const hx = live ? heli.x : 0, hy = live ? heli.y : 0;
    const hw = live ? heliSize() * 0.55 : 0, hh = live ? heliSize() * 0.30 : 0;
    // Lead the target. The shell lands one to three seconds after launch, and
    // the AI fires a further fraction of a second after solving, by which time
    // the helicopter has moved several times its own width. Checking against
    // where it is now rather than where it will be made hitting it impossible
    // and left the difficulty knobs doing nothing at all.
    const hVel = live ? heli.dir * heli.speed : 0;
    const hLead = live ? aiFireDelaySec() : 0;
    while (t < 12) {
      vx += windAccel * physScale * dt;
      vy += GRAVITY * physScale * dt;
      x += vx * dt;
      y += vy * dt;
      t += dt;
      if (live && Math.abs(x - (hx + hVel * (hLead + t))) < hw && Math.abs(y - hy) < hh) { predictHitHeli = true; break; }
      if (x < -80 || x > W + 80) break;
      if (y >= groundHeightAt(Math.max(0, Math.min(terrain.length - 1, x)))) break;
    }
    return x;
  }

  // Brutal is very hard to out-shoot, so at that level both sides get to see
  // the arc before it is fired. This traces with the same integrator step()
  // uses — sub-stepped at a 60fps dt rather than predictLandingX's coarser
  // single step — so the drawn line matches where the shell actually goes.
  function traceShot(x0, y0, angleDeg, power, windAccel) {
    const a = angleDeg * Math.PI / 180;
    const speed = power * 6.2 * physScale;
    let vx = Math.cos(a) * speed, vy = -Math.sin(a) * speed;
    let x = x0, y = y0;
    const pts = [[x, y]];
    const dt = 1 / 60, sub = 2;
    for (let i = 0; i < 900; i++) {
      for (let s = 0; s < sub; s++) {
        const sdt = dt / sub;
        vx += windAccel * physScale * sdt;
        vy += GRAVITY * physScale * sdt;
        x += vx * sdt;
        y += vy * sdt;
      }
      pts.push([x, y]);
      if (x < -20 || x > W + 20 || y > H + 60) break;
      if (y >= groundHeightAt(x)) break;
    }
    return pts;
  }

  function aimPreviewOn() { return cpuMode && aiDifficulty === 'brutal'; }

  // Gap between the AI solving its shot and actually firing. Shared so the
  // lead used when aiming can't drift away from the real delay.
  function aiFireDelayMs() { return aimPreviewOn() ? 900 : 350; }
  function aiFireDelaySec() { return aiFireDelayMs() / 1000; }

  function chooseAiShot(difficulty) {
    const cfg = DIFFICULTY_SETTINGS[difficulty] || DIFFICULTY_SETTINGS.medium;
    const shooter = tanks[currentPlayer];
    const targets = tanks.filter((t, i) => t.alive && i !== currentPlayer);
    const barrelLen = 20;
    let bestAngle = 45, bestPower = 55, bestErr = Infinity;
    let bestHeliAngle = 45, bestHeliPower = 55, bestHeliErr = Infinity;

    // Sweep the full 0-180 arc: with more than two tanks an enemy can be on
    // either side. A landing spot is scored against whichever enemy it is
    // closest to, so the AI naturally picks the target it can actually reach.
    for (let angle = 8; angle <= 172; angle += cfg.angleStep) {
      const angleRad = angle * Math.PI / 180;
      const y0 = groundHeightAt(shooter.x) - TANK_H - barrelLen * Math.sin(angleRad);
      for (let power = 15; power <= 100; power += cfg.powerStep) {
        const landX = predictLandingX(shooter.x, y0, angle, power, wind);
        if (Math.abs(landX - shooter.x) < TANK_W) continue; // don't shell yourself
        if (predictHitHeli) {
          // This shot is stopped by the airframe, so it can never reach a tank:
          // keep it out of the tank scoring (that alone is the dodge), and hold
          // on to the best one in case we decide to go hunting below.
          let herr = Infinity;
          for (const t of targets) herr = Math.min(herr, Math.abs(landX - t.x));
          if (herr < bestHeliErr) {
            bestHeliErr = herr;
            bestHeliAngle = angle;
            bestHeliPower = power;
          }
          continue;
        }
        let err = Infinity;
        for (const t of targets) err = Math.min(err, Math.abs(landX - t.x));
        if (err < bestErr) {
          bestErr = err;
          bestAngle = angle;
          bestPower = power;
        }
      }
    }

    // Difficulty-scaled human-like imprecision on top of the solved shot.
    let jitterAngle = cfg.angleJitter;
    let jitterPower = cfg.powerJitter;

    // Sometimes go for the helicopter instead, and go for it badly: a much
    // wider aim error than any tank shot, and at the lower levels it will take
    // the shot even when the wreck would come down nowhere near anybody.
    if (heli && !heli.falling && bestHeliErr < Infinity && Math.random() < cfg.heliChance) {
      const overSomeone = bestHeliErr < 70; // wreck would come down on someone
      if (overSomeone || Math.random() > cfg.heliPatience) {
        bestAngle = bestHeliAngle;
        bestPower = bestHeliPower;
        jitterAngle = cfg.heliAngleJitter;
        jitterPower = cfg.heliPowerJitter;
      }
    }

    if (Math.random() < cfg.missChance) {
      // occasional bigger miss, more likely at lower difficulty
      jitterAngle *= 2.5;
      jitterPower *= 2.5;
    }
    const finalAngle = Math.max(5, Math.min(175, bestAngle + (Math.random() * 2 - 1) * jitterAngle));
    const finalPower = Math.max(10, Math.min(100, bestPower + (Math.random() * 2 - 1) * jitterPower));
    return { angle: Math.round(finalAngle), power: Math.round(finalPower) };
  }

  // A CPU seat has no meaningful aim until it has solved its shot, so the
  // preview stays hidden while it is still "thinking".
  let cpuAimReady = false;

  function maybeAiTurn() {
    if (!isAi(currentPlayer) || state !== 'AIMING') return;
    cpuAimReady = false;
    updateHUD();
    const cfg = DIFFICULTY_SETTINGS[aiDifficulty] || DIFFICULTY_SETTINGS.medium;
    const seat = currentPlayer;
    setTimeout(() => {
      if (state !== 'AIMING' || currentPlayer !== seat) return;
      const shot = chooseAiShot(aiDifficulty);
      const shooter = tanks[seat];
      shooter.angle = shot.angle;
      shooter.power = shot.power;
      // Stronger CPU levels lean on the bigger/smarter weapons more often,
      // but only when it actually still has ammo for them.
      const r = Math.random();
      let preferred;
      if (aiDifficulty === 'easy') {
        preferred = r < 0.8 ? 'standard' : (r < 0.9 ? 'big' : 'cluster');
      } else if (aiDifficulty === 'medium') {
        preferred = r < 0.6 ? 'standard' : (r < 0.85 ? 'big' : 'cluster');
      } else {
        preferred = r < 0.4 ? 'standard' : (r < 0.75 ? 'big' : 'cluster');
      }
      weaponSelect.value = shooter.ammo[preferred] > 0 ? preferred : 'standard';
      syncControlsFromTank();
      cpuAimReady = true;
      // hold a beat longer when the arc is on screen, so it can be read
      setTimeout(fire, aiFireDelayMs());
    }, cfg.thinkMs);
  }

  // ---------- Physics step ----------
  let lastTime = null;
  function step(ts) {
    if (lastTime === null) lastTime = ts;
    let dt = (ts - lastTime) / 1000;
    dt = Math.min(dt, 0.033);
    lastTime = ts;

    if (state === 'FIRING' && projectile) {
      const sub = 2;
      for (let s = 0; s < sub; s++) {
        const sdt = dt / sub;
        projectile.vx += wind * physScale * sdt;
        projectile.vy += GRAVITY * physScale * sdt;
        projectile.x += projectile.vx * sdt;
        projectile.y += projectile.vy * sdt;
      }
      trail.push({ x: projectile.x, y: projectile.y });
      if (trail.length > 60) trail.shift();

      let hit = false;
      let outOfBounds = false;
      let shotHeli = false;
      if (projectile.x < -20 || projectile.x > W + 20 || projectile.y > H + 60) {
        outOfBounds = true;
      } else if (heliHitBy(projectile.x, projectile.y)) {
        shotHeli = true;
      } else if (projectile.y >= groundHeightAt(projectile.x)) {
        hit = true;
      } else {
        // direct tank hit check
        for (const t of tanks) {
          if (!t.alive) continue;
          const topY = groundHeightAt(t.x) - TANK_H;
          if (Math.abs(projectile.x - t.x) < TANK_W / 2 && projectile.y > topY - 4 && projectile.y < topY + TANK_H) {
            hit = true;
            break;
          }
        }
      }

      if (shotHeli) {
        // the shell bursts on the airframe; the wreck falls on its own from here
        spawnExplosionFx(projectile.x, projectile.y, 32, '#ffd27a');
        heli.falling = true;
        heli.vy = 20;
        projectile = null;
        trail = [];
        state = 'EXPLODING';
        explodeTimer = 0;
      } else if (outOfBounds) {
        projectile = null;
        trail = [];
        state = 'RESOLVED'; // shot missed entirely, move straight to next turn
      } else if (hit && projectile) {
        const weaponKey = projectile.weapon;
        const w = WEAPONS[weaponKey];
        const px = projectile.x, py = Math.min(projectile.y, groundHeightAt(projectile.x));
        if (weaponKey === 'cluster') {
          applyDamageAndCrater(px, py, weaponKey);
          for (let i = 0; i < w.clusterCount; i++) {
            clusterQueue.push({
              x: px + (Math.random() * 2 - 1) * 60 * physScale,
              vy: -(80 + Math.random() * 60) * physScale,
              vx: (Math.random() * 2 - 1) * 40 * physScale,
              delay: i * 0.08
            });
          }
          spawnClusterTimer = 0;
        } else {
          applyDamageAndCrater(px, py, weaponKey);
        }
        projectile = null;
        trail = [];
        state = 'EXPLODING';
        explodeTimer = 0;
      }
    }

    if (state === 'EXPLODING') {
      explodeTimer += dt;
      if (clusterQueue.length) {
        spawnClusterTimer += dt;
        const remaining = [];
        for (const c of clusterQueue) {
          c.delay -= dt;
          if (c.delay <= 0) {
            // simulate a short lob then explode
            let x = c.x, y = groundHeightAt(c.x) - 200 * physScale;
            let vx = c.vx, vy = c.vy;
            let t = 0;
            while (y < groundHeightAt(x) && t < 2) {
              vx += wind * physScale * 0.05; // bomblets drift like any other shell
              vy += GRAVITY * physScale * 0.05;
              x += vx * 0.05;
              y += vy * 0.05;
              t += 0.05;
            }
            applyDamageAndCrater(x, groundHeightAt(x), 'cluster');
          } else {
            remaining.push(c);
          }
        }
        clusterQueue = remaining;
      }
      updateHUD();
      if (explodeTimer > 0.9 && clusterQueue.length === 0 && explosions.every(e => e.t > e.maxR / 90)) {
        state = 'RESOLVED';
      }
    }

    if (state === 'RESOLVED') {
      nextTurn();
    }

    // explosion fx aging
    explosions.forEach(e => { e.t += dt * 90; e.r = Math.min(e.maxR, 4 + e.t); });
    explosions = explosions.filter(e => e.r < e.maxR - 0.5);
    particles.forEach(p => {
      p.age += dt;
      p.vy += 220 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    });
    particles = particles.filter(p => p.age < p.life);
    windPulse = Math.max(0, windPulse - dt * 1.6);
    updateHeli(dt);

    render();
    requestAnimationFrame(step);
  }
  let explodeTimer = 0;
  let spawnClusterTimer = 0;

  // ---------- Rendering ----------
  let decorClock = 0;

  function drawDecor() {
    const kind = theme.decor;
    decorClock += 0.016;

    if (kind === 'stars') {
      for (const s of decorItems) {
        const twinkle = 0.55 + 0.45 * Math.sin(decorClock * 1.5 + s.tw);
        ctx.globalAlpha = twinkle;
        ctx.fillStyle = theme.decorColor;
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      return;
    }

    if (kind === 'clouds') {
      ctx.fillStyle = theme.decorColor;
      for (const c of decorItems) {
        c.x += c.drift * 0.006;
        if (c.x > 1.2) c.x = -0.2;
        const cx = c.x * W, cy = c.y * H, s = c.s * (W * 0.05);
        ctx.beginPath();
        ctx.arc(cx, cy, s, 0, Math.PI * 2);
        ctx.arc(cx + s * 0.8, cy + s * 0.15, s * 0.75, 0, Math.PI * 2);
        ctx.arc(cx - s * 0.85, cy + s * 0.2, s * 0.65, 0, Math.PI * 2);
        ctx.arc(cx + s * 0.2, cy - s * 0.45, s * 0.6, 0, Math.PI * 2);
        ctx.fill();
      }
      return;
    }

    // embers / dust / snow: drifting particles
    ctx.fillStyle = theme.decorColor;
    for (const p of decorItems) {
      p.y += p.vy * 0.01;
      p.x += p.vx * 0.01;
      if (p.y < -0.05) p.y = 1.05;
      if (p.y > 1.05) p.y = -0.05;
      if (p.x < -0.05) p.x = 1.05;
      if (p.x > 1.05) p.x = -0.05;
      ctx.beginPath();
      ctx.arc(p.x * W, p.y * H, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---------- Helicopter ----------
  // An occasional fly-by, high above the peaks. Shoot it and it comes down;
  // whatever it lands on is finished, which makes it a gamble worth taking.
  let heli = null;
  let rotorAngle = 0;
  // the first one comes sooner so it gets discovered; after that it's rare
  let heliTimer = 60 + Math.random() * 50;

  function heliSize() { return Math.max(30, Math.min(58, W * 0.04)); }

  // Cruise just clear of the tallest peak rather than at a fixed height near
  // the top of the canvas. On a low or flat map a fixed altitude left the
  // helicopter miles above every barrel and simply unreachable; anchoring to
  // the terrain keeps the shot on the table whatever the map looks like, while
  // still passing over every hill. Craters only ever lower ground, so as a
  // round chews the map down the fly-by drifts down with it.
  function heliCruiseY() {
    let peak = H * 0.5;
    for (let x = 0; x < terrain.length; x++) if (terrain[x] < peak) peak = terrain[x];
    // clearance comfortably exceeds TANK_H, so it clears a tank sat on the peak
    const clearance = Math.max(34, H * 0.075) + Math.random() * H * 0.03;
    return Math.max(H * 0.05, peak - clearance);
  }

  // It turns back at the edges rather than leaving on the first pass, so the
  // fly-by isn't a lottery won by whoever happens to be up when it appears.
  // It always makes at least one return trip: with two players both may have
  // technically "had a turn" during a single crossing, while the one who was
  // mid-shot barely saw it. The upper bound stops it loitering through a slow
  // round.
  const HELI_MIN_LEGS = 2, HELI_MAX_LEGS = 6;

  function spawnHeli() {
    const fromLeft = Math.random() < 0.5;
    const w = heliSize();
    heli = {
      x: fromLeft ? -w : W + w,
      y: heliCruiseY(),
      dir: fromLeft ? 1 : -1,
      speed: W / (9 + Math.random() * 5),   // ~9-14s to cross, whatever the width
      vy: 0,
      falling: false,
      spin: 0,
      legs: 0,
      // whoever is aiming right now can already shoot at it; anyone mid-shot
      // cannot, and gets counted when their next turn starts
      seen: new Set(state === 'AIMING' ? [currentPlayer] : [])
    };
  }

  function heliHitBy(px, py) {
    if (!heli || heli.falling) return false;
    const w = heliSize();
    return Math.abs(px - heli.x) < w * 0.55 && Math.abs(py - heli.y) < w * 0.30;
  }

  // Landing on a tank destroys it outright; everything close by takes a big
  // blast. This is deliberately harsher than any shell in the game.
  function heliCrash(x, y) {
    const CRUSH = 26, BLAST = 74, BLAST_DMG = 80;
    for (const t of tanks) {
      if (!t.alive) continue;
      if (Math.abs(t.x - x) < CRUSH) { t.hp = 0; t.alive = false; continue; }
      const tankTopY = groundHeightAt(t.x) - TANK_H;
      const dist = Math.sqrt((t.x - x) * (t.x - x) + (tankTopY - y) * (tankTopY - y));
      if (dist < BLAST) {
        t.hp -= BLAST_DMG * (1 - dist / BLAST);
        if (t.hp <= 0) { t.hp = 0; t.alive = false; }
      }
    }
    craterAt(x, y, BLAST * 0.7);
    spawnExplosionFx(x, y, BLAST, '#ffb03a');
    for (let i = 0; i < 36; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 60 + Math.random() * 200;
      particles.push({
        x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 90,
        life: 0.6 + Math.random() * 0.7, age: 0,
        color: Math.random() < 0.5 ? '#ffb03a' : '#6d7684'
      });
    }
    updateHUD();
    // A crash can kill between turns, so the round may need resolving here.
    if (state === 'AIMING') {
      if (endTurnCheckWin()) return;
      if (!tanks[currentPlayer].alive) nextTurn();
    }
  }

  function updateHeli(dt) {
    rotorAngle += dt * 26;
    if (!heli) {
      if (state !== 'GAMEOVER') {
        heliTimer -= dt;
        if (heliTimer <= 0) { spawnHeli(); heliTimer = 120 + Math.random() * 60; }
      }
      return;
    }
    const w = heliSize();
    if (!heli.falling) {
      heli.x += heli.dir * heli.speed * dt;
      if (heli.x < -w * 1.5 || heli.x > W + w * 1.5) {
        heli.legs++;
        const allHadATurn = tanks.every((t, i) => !t.alive || heli.seen.has(i));
        if ((allHadATurn && heli.legs >= HELI_MIN_LEGS) || heli.legs >= HELI_MAX_LEGS) {
          heli = null;
        } else {
          // Come back in over the edge it just left, rather than reappearing on
          // the far side, at a slightly different altitude each time.
          const leftOverRight = heli.x > W;
          heli.dir = leftOverRight ? -1 : 1;
          heli.x = leftOverRight ? W + w * 1.5 : -w * 1.5;
          heli.y = heliCruiseY();
        }
      }
      return;
    }
    heli.vy += GRAVITY * physScale * dt * 0.75;
    heli.x += heli.dir * heli.speed * 0.35 * dt;
    heli.y += heli.vy * dt;
    heli.spin += dt * (4 + heli.vy * 0.004);
    if (Math.random() < 0.6) {
      particles.push({
        x: heli.x + (Math.random() * 2 - 1) * 8, y: heli.y,
        vx: (Math.random() * 2 - 1) * 20, vy: -20 - Math.random() * 30,
        life: 0.6 + Math.random() * 0.6, age: 0,
        color: Math.random() < 0.5 ? '#59606b' : '#ff7a45'
      });
    }
    if (heli.x < -60 || heli.x > W + 60) { heli = null; return; } // fell off the map
    if (heli.y >= groundHeightAt(heli.x) - 4) {
      const cx = Math.max(0, Math.min(W - 1, heli.x));
      const cy = groundHeightAt(cx);
      heli = null;
      heliCrash(cx, cy);
    }
  }

  function drawHeli() {
    if (!heli) return;
    const w = heliSize(), h = w * 0.34;
    ctx.save();
    ctx.translate(heli.x, heli.y);
    if (heli.falling) ctx.rotate(heli.spin);
    ctx.scale(heli.dir, 1);

    ctx.fillStyle = heli.falling ? '#6b4a34' : '#46525f';
    ctx.beginPath();
    ctx.ellipse(0, 0, w * 0.30, h * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(-w * 0.56, -h * 0.10, w * 0.34, h * 0.20); // tail boom
    ctx.fillRect(-w * 0.60, -h * 0.60, w * 0.07, h * 0.60); // tail fin

    ctx.fillStyle = 'rgba(185,222,255,0.78)';
    ctx.beginPath();
    ctx.ellipse(w * 0.14, -h * 0.05, w * 0.10, h * 0.30, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#2b333d';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-w * 0.18, h * 0.66); ctx.lineTo(w * 0.20, h * 0.66);
    ctx.stroke();

    // rotors, drawn as a blade seen edge-on so they read as spinning
    ctx.strokeStyle = 'rgba(232,238,247,0.9)';
    ctx.lineWidth = 2;
    const blade = Math.cos(rotorAngle) * w * 0.48;
    ctx.beginPath();
    ctx.moveTo(-blade, -h * 0.78); ctx.lineTo(blade, -h * 0.78);
    ctx.moveTo(0, -h * 0.78); ctx.lineTo(0, -h * 0.5);
    ctx.stroke();
    const tail = Math.cos(rotorAngle * 1.7) * h * 0.5;
    ctx.beginPath();
    ctx.moveTo(-w * 0.58, -h * 0.30 - tail); ctx.lineTo(-w * 0.58, -h * 0.30 + tail);
    ctx.stroke();
    ctx.restore();
  }

  // Drawn detail only — TANK_W and TANK_H still define the collision box, so
  // nothing here changes how shots land or how damage is scored.
  function drawTank(t) {
    const gy = groundHeightAt(t.x);
    const w = TANK_W, h = TANK_H;
    ctx.save();
    ctx.translate(t.x, gy);

    // tracks, with road wheels showing through
    const trackH = 5, trackW = w + 4;
    ctx.fillStyle = '#26222b';
    pillPath(-trackW / 2, -trackH, trackW, trackH, 2.5);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.20)';
    for (let i = 0; i < 4; i++) {
      const x = -trackW / 2 + 4 + i * ((trackW - 8) / 3);
      ctx.beginPath();
      ctx.arc(x, -trackH / 2, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // hull, sloped front and back rather than a plain block
    ctx.fillStyle = t.color;
    ctx.beginPath();
    ctx.moveTo(-w / 2, -trackH);
    ctx.lineTo(-w / 2 + 3.5, -h + 4);
    ctx.lineTo(w / 2 - 3.5, -h + 4);
    ctx.lineTo(w / 2, -trackH);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.22)'; // shaded skirt
    ctx.fillRect(-w / 2 + 1, -trackH - 1.5, w - 2, 1.5);
    ctx.fillStyle = 'rgba(255,255,255,0.20)'; // lit deck
    ctx.fillRect(-w / 2 + 3.5, -h + 4, w - 7, 1.4);

    // turret
    ctx.fillStyle = t.color;
    ctx.beginPath();
    ctx.moveTo(-7, -h + 4);
    ctx.lineTo(-4.5, -h - 1);
    ctx.lineTo(4.5, -h - 1);
    ctx.lineTo(7, -h + 4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillRect(-4.5, -h - 1, 9, 1.2);

    // barrel: dark sleeve under a coloured core, with a muzzle brake
    const ang = t.angle * Math.PI / 180;
    const bx = Math.cos(ang), by = -Math.sin(ang);
    const py = -h + 1;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#241f29';
    ctx.lineWidth = 4.6;
    ctx.beginPath();
    ctx.moveTo(0, py); ctx.lineTo(bx * 19, py + by * 19);
    ctx.stroke();
    ctx.strokeStyle = t.color;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(0, py); ctx.lineTo(bx * 18, py + by * 18);
    ctx.stroke();
    ctx.strokeStyle = '#241f29';
    ctx.lineWidth = 4.6;
    ctx.beginPath();
    ctx.moveTo(bx * 16, py + by * 16); ctx.lineTo(bx * 20, py + by * 20);
    ctx.stroke();

    ctx.restore();
  }

  // ---------- Wind indicators ----------
  // Sky streaks drift with the wind so its direction and force are readable
  // at a glance from the playfield, not just from the number in the HUD.
  const windStreaks = [];
  for (let i = 0; i < 22; i++) {
    windStreaks.push({
      x: Math.random(),
      y: 0.04 + Math.random() * 0.6,
      len: 0.025 + Math.random() * 0.06,
      sp: 0.7 + Math.random() * 0.9,
      a: 0.25 + Math.random() * 0.45
    });
  }

  function drawWindStreaks() {
    const s = windStrength();
    if (s < 0.06) return; // dead calm — nothing to show
    const dir = wind >= 0 ? 1 : -1;
    ctx.lineCap = 'round';
    ctx.lineWidth = 1.5;
    // Speed off normalized strength, so retuning WIND_MAX doesn't change the pace.
    const drift = (wind >= 0 ? s : -s) * 190 * 0.016;
    for (const k of windStreaks) {
      k.x += drift / W * k.sp;
      if (k.x > 1.2) k.x = -0.2;
      if (k.x < -0.2) k.x = 1.2;
      const len = k.len * W * (0.35 + s * 0.9);
      ctx.strokeStyle = `rgba(${streakRGB},${(k.a * s * 0.6).toFixed(3)})`;
      ctx.beginPath();
      ctx.moveTo(k.x * W, k.y * H);
      ctx.lineTo(k.x * W - dir * len, k.y * H);
      ctx.stroke();
    }
  }

  function pillPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // A dark pill keeps the gauge legible over both the bright and dark skies.
  function drawWindGauge() {
    const s = windStrength();
    const col = windColor();
    const PW = Math.min(250, W - 24);
    const PH = 30;
    const px = (W - PW) / 2;
    const py = 10;
    const midY = py + PH / 2;

    ctx.save();
    pillPath(px, py, PW, PH, 6);
    ctx.fillStyle = 'rgba(12,11,16,0.62)';
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = `rgba(255,255,255,${(0.16 + windPulse * 0.55).toFixed(3)})`;
    ctx.stroke();

    ctx.textBaseline = 'middle';
    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(236,231,225,0.6)';
    ctx.fillText(txt('wind'), px + 10, midY);

    ctx.textAlign = 'right';
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillStyle = col;
    ctx.fillText(windForce() + '/10', px + PW - 10, midY);

    // Track with a centre tick, so the arrow reads as "how far from calm".
    const g0 = px + 48, g1 = px + PW - 52;
    const gc = (g0 + g1) / 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(g0, midY); ctx.lineTo(g1, midY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gc, midY - 5); ctx.lineTo(gc, midY + 5); ctx.stroke();

    if (s > 0.02) {
      const dir = wind >= 0 ? 1 : -1;
      const len = Math.max(10, s * ((g1 - g0) / 2 - 6));
      const ex = gc + dir * len;
      ctx.strokeStyle = col;
      ctx.fillStyle = col;
      ctx.lineWidth = 3 + windPulse * 1.5;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(gc, midY); ctx.lineTo(ex - dir * 5, midY); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ex, midY);
      ctx.lineTo(ex - dir * 9, midY - 6);
      ctx.lineTo(ex - dir * 9, midY + 6);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // Dashed arc from the active tank's barrel, in that player's colour, ending
  // in a ring at the predicted impact point.
  function drawAimPreview() {
    if (state !== 'AIMING') return;
    const t = tanks[currentPlayer];
    if (!t || !t.alive) return;
    const full = aimPreviewOn();
    // Everyone gets the short hint on their own turn; only Brutal shows the
    // whole arc, and only Brutal telegraphs a CPU shot.
    if (!full && isAi(currentPlayer)) return;
    if (isAi(currentPlayer) && !cpuAimReady) return;

    const a = t.angle * Math.PI / 180;
    const barrelLen = 20;
    const x0 = t.x + barrelLen * Math.cos(a);
    const y0 = groundHeightAt(t.x) - TANK_H - barrelLen * Math.sin(a);
    const pts = traceShot(x0, y0, t.angle, t.power, wind);
    if (pts.length < 2) return;

    ctx.save();
    if (full) {
      ctx.strokeStyle = t.color;
      ctx.lineWidth = 1.6;
      ctx.globalAlpha = 0.5;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.stroke();
      ctx.setLineDash([]);

      const end = pts[pts.length - 1];
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(end[0], end[1], 5, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      // Roughly the first half second of flight, fading out: enough to read
      // departure angle and which way the wind is bending it, not enough to
      // hand over the landing spot.
      const SHORT = 34;
      const n = Math.min(SHORT, pts.length);
      ctx.fillStyle = t.color;
      for (let i = 2; i < n; i += 3) {
        ctx.globalAlpha = 0.5 * (1 - i / SHORT);
        ctx.beginPath();
        ctx.arc(pts[i][0], pts[i][1], 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    // sky
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, theme.skyTop);
    skyGrad.addColorStop(1, theme.skyBot);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    drawDecor();
    drawWindStreaks();

    // terrain
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x < terrain.length; x += 2) {
      ctx.lineTo(x, terrain[x]);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    const groundGrad = ctx.createLinearGradient(0, H * 0.3, 0, H);
    groundGrad.addColorStop(0, theme.ground1);
    groundGrad.addColorStop(1, theme.ground2);
    ctx.fillStyle = groundGrad;
    ctx.fill();
    ctx.strokeStyle = theme.rim;
    ctx.lineWidth = 2;
    ctx.stroke();

    // tanks
    tanks.forEach(t => { if (t.alive) drawTank(t); });

    drawHeli();
    drawAimPreview();

    // trail
    if (trail.length > 1) {
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      trail.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.stroke();
    }

    // projectile
    if (projectile) {
      ctx.fillStyle = WEAPONS[projectile.weapon].color;
      ctx.beginPath();
      ctx.arc(projectile.x, projectile.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    // explosions
    explosions.forEach(e => {
      const alpha = Math.max(0, 1 - e.r / e.maxR);
      const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r);
      grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
      grad.addColorStop(0.4, e.color);
      grad.addColorStop(1, 'rgba(255,80,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // particles
    particles.forEach(p => {
      const alpha = 1 - p.age / p.life;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
      ctx.globalAlpha = 1;
    });

    drawWindGauge(); // last, so it stays readable over everything
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 150));
  // Mobile browsers resize the visual viewport when the address bar hides/shows
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  resize();
  initLanguage();
  refreshOpponentUi();
  resetGame();
  requestAnimationFrame(step);
  // iOS Safari can report stale/zero layout on first paint; re-measure shortly after.
  setTimeout(resize, 60);
  setTimeout(resize, 400);
  window.addEventListener('load', resize);
})();
</script>
</body>
</html>

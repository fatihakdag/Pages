      ctx.beginPath();
      ctx.arc(x, -trackH / 2, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // hull, sloped front and back rather than a plain block
    ctx.fillStyle = t.color;
    ctx.beginPath();
    ctx.moveTo(-w / 2, -trackH);
    ctx.lineTo(-w / 2 + 3.5, -h + 4);
    ctx.lineTo(w / 2 - 3.5, -h + 4);
    ctx.lineTo(w / 2, -trackH);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.22)'; // shaded skirt
    ctx.fillRect(-w / 2 + 1, -trackH - 1.5, w - 2, 1.5);
    ctx.fillStyle = 'rgba(255,255,255,0.20)'; // lit deck
    ctx.fillRect(-w / 2 + 3.5, -h + 4, w - 7, 1.4);

    // turret
    ctx.fillStyle = t.color;
    ctx.beginPath();
    ctx.moveTo(-7, -h + 4);
    ctx.lineTo(-4.5, -h - 1);
    ctx.lineTo(4.5, -h - 1);
    ctx.lineTo(7, -h + 4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillRect(-4.5, -h - 1, 9, 1.2);

    // barrel: dark sleeve under a coloured core, with a muzzle brake
    const ang = t.angle * Math.PI / 180;
    const bx = Math.cos(ang), by = -Math.sin(ang);
    const py = -h + 1;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#241f29';
    ctx.lineWidth = 4.6;
    ctx.beginPath();
    ctx.moveTo(0, py); ctx.lineTo(bx * 19, py + by * 19);
    ctx.stroke();
    ctx.strokeStyle = t.color;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(0, py); ctx.lineTo(bx * 18, py + by * 18);
    ctx.stroke();
    ctx.strokeStyle = '#241f29';
    ctx.lineWidth = 4.6;
    ctx.beginPath();
    ctx.moveTo(bx * 16, py + by * 16); ctx.lineTo(bx * 20, py + by * 20);
    ctx.stroke();

    ctx.restore();
  }

  // ---------- Wind indicators ----------
  // Sky streaks drift with the wind so its direction and force are readable
  // at a glance from the playfield, not just from the number in the HUD.
  const windStreaks = [];
  for (let i = 0; i < 22; i++) {
    windStreaks.push({
      x: Math.random(),
      y: 0.04 + Math.random() * 0.6,
      len: 0.025 + Math.random() * 0.06,
      sp: 0.7 + Math.random() * 0.9,
      a: 0.25 + Math.random() * 0.45
    });
  }

  function drawWindStreaks() {
    const s = windStrength();
    if (s < 0.06) return; // dead calm — nothing to show
    const dir = wind >= 0 ? 1 : -1;
    ctx.lineCap = 'round';
    ctx.lineWidth = 1.5;
    // Speed off normalized strength, so retuning WIND_MAX doesn't change the pace.
    const drift = (wind >= 0 ? s : -s) * 190 * 0.016;
    for (const k of windStreaks) {
      k.x += drift / W * k.sp;
      if (k.x > 1.2) k.x = -0.2;
      if (k.x < -0.2) k.x = 1.2;
      const len = k.len * W * (0.35 + s * 0.9);
      ctx.strokeStyle = `rgba(${streakRGB},${(k.a * s * 0.6).toFixed(3)})`;
      ctx.beginPath();
      ctx.moveTo(k.x * W, k.y * H);
      ctx.lineTo(k.x * W - dir * len, k.y * H);
      ctx.stroke();
    }
  }

  function pillPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // A dark pill keeps the gauge legible over both the bright and dark skies.
  // In CSS pixels, not world units: see drawWindGauge.
  function windGaugeRect() {
    const w = Math.min(250, viewW - 24);
    return { x: (viewW - w) / 2, y: 10, w: w, h: 30 };
  }

  function drawWindGauge() {
    const s = windStrength();
    const col = windColor();
    const box = windGaugeRect();
    const PW = box.w, PH = box.h, px = box.x, py = box.y;
    const midY = py + PH / 2;

    ctx.save();
    pillPath(px, py, PW, PH, 6);
    ctx.fillStyle = 'rgba(12,11,16,0.62)';
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = `rgba(255,255,255,${(0.16 + windPulse * 0.55).toFixed(3)})`;
    ctx.stroke();

    ctx.textBaseline = 'middle';
    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(236,231,225,0.6)';
    ctx.fillText(txt('wind'), px + 10, midY);

    ctx.textAlign = 'right';
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillStyle = col;
    ctx.fillText(windForce() + '/10', px + PW - 10, midY);

    // Track with a centre tick, so the arrow reads as "how far from calm".
    const g0 = px + 48, g1 = px + PW - 52;
    const gc = (g0 + g1) / 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(g0, midY); ctx.lineTo(g1, midY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gc, midY - 5); ctx.lineTo(gc, midY + 5); ctx.stroke();

    if (s > 0.02) {
      const dir = wind >= 0 ? 1 : -1;
      const len = Math.max(10, s * ((g1 - g0) / 2 - 6));
      const ex = gc + dir * len;
      ctx.strokeStyle = col;
      ctx.fillStyle = col;
      ctx.lineWidth = 3 + windPulse * 1.5;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(gc, midY); ctx.lineTo(ex - dir * 5, midY); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ex, midY);
      ctx.lineTo(ex - dir * 9, midY - 6);
      ctx.lineTo(ex - dir * 9, midY + 6);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // Dashed arc from the active tank's barrel, in that player's colour, ending
  // in a ring at the predicted impact point.
  function drawAimPreview() {
    if (state !== 'AIMING') return;
    const t = tanks[currentPlayer];
    if (!t || !t.alive) return;
    const full = aimPreviewOn();
    // Everyone gets the short hint on their own turn; only Brutal shows the
    // whole arc, and only Brutal telegraphs a CPU shot.
    if (!full && isAi(currentPlayer)) return;
    if (isAi(currentPlayer) && !cpuAimReady) return;

    const a = t.angle * Math.PI / 180;
    const barrelLen = 20;
    const x0 = t.x + barrelLen * Math.cos(a);
    const y0 = groundHeightAt(t.x) - TANK_H - barrelLen * Math.sin(a);
    let pts = traceShot(x0, y0, t.angle, t.power, wind);
    if (pts.length < 2) return;
    // traceShot integrates a plain parabola. A guided shell leaves that path at
    // apex, so the preview stops there rather than promising a landing spot it
    // has no intention of using.
    const guided = WEAPONS[t.weapon] && WEAPONS[t.weapon].guides;
    if (guided) {
      let apex = pts.length;
      for (let i = 1; i < pts.length; i++) {
        if (pts[i][1] >= pts[i - 1][1]) { apex = i + 1; break; }
      }
      pts = pts.slice(0, apex);
      if (pts.length < 2) return;
    }

    ctx.save();
    if (full) {
      ctx.strokeStyle = t.color;
      ctx.lineWidth = 1.6;
      ctx.globalAlpha = 0.5;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.stroke();
      ctx.setLineDash([]);

      if (!guided) {
        const end = pts[pts.length - 1];
        ctx.globalAlpha = 0.85;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(end[0], end[1], 5, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else {
      // Roughly the first half second of flight, fading out: enough to read
      // departure angle and which way the wind is bending it, not enough to
      // hand over the landing spot.
      const SHORT = 34;
      const n = Math.min(SHORT, pts.length);
      ctx.fillStyle = t.color;
      for (let i = 2; i < n; i += 3) {
        ctx.globalAlpha = 0.5 * (1 - i / SHORT);
        ctx.beginPath();
        ctx.arc(pts[i][0], pts[i][1], 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    // sky
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, theme.skyTop);
    skyGrad.addColorStop(1, theme.skyBot);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    drawDecor();
    drawWindStreaks();

    // terrain
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x < terrain.length; x += 2) {
      ctx.lineTo(x, terrain[x]);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    const groundGrad = ctx.createLinearGradient(0, H * 0.3, 0, H);
    groundGrad.addColorStop(0, theme.ground1);
    groundGrad.addColorStop(1, theme.ground2);
    ctx.fillStyle = groundGrad;
    ctx.fill();
    ctx.strokeStyle = theme.rim;
    ctx.lineWidth = 2;
    ctx.stroke();

    // tanks
    tanks.forEach(t => { if (t.alive) drawTank(t); });

    drawHeli();
    drawAimPreview();

    // trails and shells, one set per warhead in the air
    for (const p of projectiles) {
      if (p.trail.length > 1) {
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        p.trail.forEach((pt, idx) => idx === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
        ctx.stroke();
      }
      const pw = WEAPONS[p.weapon];
      ctx.fillStyle = pw.color;
      if (p.rolling) {
        // A rolling mine reads as a spiked drum sitting on the ground, and the
        // spin direction shows which way it is travelling.
        const r = 6;
        const cy = p.y - r;
        const spin = p.x / r;
        ctx.strokeStyle = pw.color;
        ctx.lineWidth = 2;
        for (let i = 0; i < 6; i++) {
          const a = spin + i * Math.PI / 3;
          ctx.beginPath();
          ctx.moveTo(p.x + Math.cos(a) * r, cy + Math.sin(a) * r);
          ctx.lineTo(p.x + Math.cos(a) * (r + 3), cy + Math.sin(a) * (r + 3));
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(p.x, cy, r, 0, Math.PI * 2);
        ctx.fill();
      } else if (pw.guides) {
        // Pointed along its heading, so the nose-over at apex is visible, with
        // a flame out the back while the motor is lit.
        const a = Math.atan2(p.vy, p.vx);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(a);
        if (p.burnLeft > 0) {
          ctx.fillStyle = '#ffb03a';
          ctx.beginPath();
          ctx.moveTo(-5, 0);
          ctx.lineTo(-11 - Math.random() * 5, 2.2);
          ctx.lineTo(-11 - Math.random() * 5, -2.2);
          ctx.closePath();
          ctx.fill();
        }
        ctx.fillStyle = pw.color;
        ctx.beginPath();
        ctx.moveTo(7, 0);
        ctx.lineTo(-5, 3);
        ctx.lineTo(-5, -3);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      } else {
        // An unsplit MIRV is drawn fatter than the warheads it carries.
        ctx.beginPath();
        ctx.arc(p.x, p.y, WEAPONS[p.weapon].mirvCount && !p.split ? 6 : 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // explosions
    explosions.forEach(e => {
      const alpha = Math.max(0, 1 - e.r / e.maxR);
      const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r);
      grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
      grad.addColorStop(0.4, e.color);
      grad.addColorStop(1, 'rgba(255,80,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // particles
    particles.forEach(p => {
      const alpha = 1 - p.age / p.life;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
      ctx.globalAlpha = 1;
    });

    // Only one wind readout at a time: the bar's pill where it fits, this otherwise.
    // The gauge is UI sitting on top of the battlefield, not part of it: drawn
    // in CSS pixels so its text stays the same readable size whether the world
    // is 1400px wide or 390px wide.
    if (!hudWindVisible) {
      screenTransform();
      drawWindGauge();
      worldTransform();
    }
  }

  // ---------- Online ----------
  // A match is carried by the relay in server/, which only moves messages
  // between the members of a room. The game logic stays here: whoever's turn it
  // is simulates the shot and tells the others what happened, so there is no
  // second copy of the physics anywhere.
  //
  // Per turn two messages go out. `turn` carries the inputs, so the other side
  // can watch the same shot fly rather than have the result appear. `sync`
  // carries the state afterwards, which is what actually decides the outcome —
  // small divergences in the replay are erased every turn instead of
  // accumulating, so the two clients never drift apart.

  const NET_PROTOCOL = 1;

  const online = {
    ws: null,
    room: null,
    id: null,        // our member id on the relay
    seat: -1,        // which tank we drive; -1 until seats are dealt
    seats: [],       // member id per tank index
    host: false,
    status: 'offline', // offline | connecting | waiting | playing | ended
    error: null,
    pendingSync: null  // a sync that arrived while a shot was still in the air
  };

  /** True once we are in a match, as opposed to merely connected. */
  function netPlaying() { return online.status === 'playing'; }
  /** A seat somebody else drives — locked for us exactly like a CPU seat. */
  function netRemoteSeat(i) { return netPlaying() && i !== online.seat; }

  // Overridable so tests can drive the protocol without a real socket.
  let socketFactory = (url) => new WebSocket(url);

  function relayUrl() {
    const override = new URLSearchParams(location.search).get('relay');
    if (override) return override;
    const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
    return `${scheme}//${location.host}`;
  }

  function netStatusText() {
    if (online.error) return online.error;
    if (online.status === 'connecting') return txt('netConnecting');
    if (online.status === 'waiting') return txt('netWaiting', { code: online.room });
    if (online.status === 'playing') return txt('netPlaying', { code: online.room });
    if (online.status === 'ended') return txt('netEnded');
    return txt('netOffline');
  }

  function refreshOnlineUi() {
    onlineStatus.textContent = netStatusText();
    const busy = online.status !== 'offline' && online.status !== 'ended';
    onlineHostBtn.disabled = busy;
    onlineJoinBtn.disabled = busy;
    onlineCodeInput.disabled = busy;
  }

  function netSend(kind, extra) {
    if (!online.ws || online.ws.readyState !== 1) return;
    online.ws.send(JSON.stringify({ t: 'msg', d: { k: kind, ...extra } }));
  }

  function netFail(message) {
    online.error = message;
    online.status = 'offline';
    refreshOnlineUi();
  }

  function netConnect(room) {
    if (online.ws) return;
    online.error = null;
    online.status = 'connecting';
    online.room = room || null;
    refreshOnlineUi();

    let ws;
    try { ws = socketFactory(relayUrl()); }
    catch { return netFail(txt('netLost')); }
    online.ws = ws;

    ws.addEventListener('open', () => {
      ws.send(JSON.stringify({ t: 'join', v: NET_PROTOCOL, room: room || undefined }));
    });
    ws.addEventListener('message', (ev) => {
      let m;
      try { m = JSON.parse(ev.data); } catch { return; }
      netHandle(m);
    });
    ws.addEventListener('close', () => {
      const wasPlaying = netPlaying();
      online.ws = null;
      online.seat = -1;
      online.seats = [];
      online.status = wasPlaying ? 'ended' : 'offline';
      if (!wasPlaying && !online.error) online.error = txt('netLost');
      refreshOnlineUi();
      syncControlsFromTank();
      updateHUD();
    });
    ws.addEventListener('error', () => { /* close follows */ });
  }

  function netHandle(m) {
    if (m.t === 'err') {
      const known = { NO_ROOM: 'netNoRoom', ROOM_FULL: 'netFull', BAD_VERSION: 'netVersion' };
      netFail(known[m.code] ? txt(known[m.code]) : m.code);
      if (online.ws) online.ws.close();
      return;
    }

    if (m.t === 'joined') {
      online.id = m.id;
      online.room = m.room;
      online.host = m.host === m.id;
      netPeerIds = m.peers.map(p => p.id);
      online.status = 'waiting';
      onlineCodeInput.value = m.room;
      // Joining a room that already has someone in it means the match is on;
      // the host deals the seats and the world.
      if (m.peers.length && !online.host) netSend('ready', {});
      refreshOnlineUi();
      return;
    }

    if (m.t === 'peer') {
      // Someone arrived in our room. If we are the host, start the match.
      if (!netPeerIds.includes(m.id)) netPeerIds.push(m.id);
      if (online.host) netStartMatch();
      return;
    }

    if (m.t === 'gone') {
      netPeerIds = netPeerIds.filter(id => id !== m.id);
      online.status = 'ended';
      online.seat = -1;
      refreshOnlineUi();
      syncControlsFromTank();
      updateHUD();
      return;
    }

    if (m.t !== 'msg' || !m.d) return;
    const d = m.d;

    if (d.k === 'ready' && online.host) { netStartMatch(); return; }

    if (d.k === 'start') {
      online.seats = d.seats;
      online.seat = d.seats.indexOf(online.id);
      online.status = 'playing';
      cpuMode = false;
      playerCount = d.seats.length;
      countSelect.value = String(playerCount);
      refreshOpponentUi();
      netApplyState(d.state);
      refreshOnlineUi();
      return;
    }

    if (!netPlaying()) return;

    if (d.k === 'turn') {
      // Replay their inputs so the shot is watched, not merely reported.
      const t = tanks[d.seat];
      if (!t || state !== 'AIMING') return;
      currentPlayer = d.seat;
      t.angle = d.angle;
      t.power = d.power;
      t.weapon = d.weapon;
      fire();
      return;
    }

    if (d.k === 'sync') {
      // Snapping mid-flight would cut the shot off, so hold it until the local
      // replay has finished and then correct whatever drifted.
      if (state === 'AIMING' || state === 'GAMEOVER') netApplyState(d.state);
      else online.pendingSync = d.state;
      return;
    }
  }

  /** Host only: deal seats and hand out the world everyone will play on. */
  function netStartMatch() {
    if (!online.host || netPlaying()) return;
    cpuMode = false;
    playerCount = 2;
    countSelect.value = '2';
    refreshOpponentUi();
    resetGame();
    // Seat order follows join order, so the host is player 1.
    online.seats = [online.id, ...netOtherIds()];
    online.seat = 0;
    online.status = 'playing';
    netSend('start', { seats: online.seats, state: netSnapshot() });
    refreshOnlineUi();
    syncControlsFromTank();
    updateHUD();
  }

  // The relay tells us who is in the room as they arrive; we only ever need the
  // one other player for a two-seat match.
  let netPeerIds = [];
  function netOtherIds() { return netPeerIds.slice(0, playerCount - 1); }

  // Infinity is not JSON, and the standard shell's ammo is Infinity.
  const AMMO_INFINITE = -1;
  function ammoOut(a) {
    const out = {};
    for (const k in a) out[k] = (a[k] === Infinity) ? AMMO_INFINITE : a[k];
    return out;
  }
  function ammoIn(a) {
    const out = {};
    for (const k in a) out[k] = (a[k] === AMMO_INFINITE) ? Infinity : a[k];
    return out;
  }

  function netSnapshot() {
    return {
      terrain: Array.from(terrain),
      tanks: tanks.map(t => ({
        x: t.x, hp: t.hp, alive: t.alive,
        angle: t.angle, power: t.power, weapon: t.weapon, ammo: ammoOut(t.ammo)
      })),
      wind, currentPlayer, state,
      theme: THEMES.indexOf(theme),
      heli: heli ? { x: heli.x, y: heli.y, dir: heli.dir, speed: heli.speed, falling: heli.falling } : null
    };
  }

  function netApplyState(snap) {
    if (!snap) return;
    if (snap.theme >= 0 && THEMES[snap.theme] && THEMES[snap.theme] !== theme) {
      applyTheme(THEMES[snap.theme]);
      buildDecor();
    }
    terrain = snap.terrain.slice();
    snap.tanks.forEach((s, i) => {
      const t = tanks[i];
      if (!t) return;
      t.x = s.x; t.hp = s.hp; t.alive = s.alive;
      t.angle = s.angle; t.power = s.power; t.weapon = s.weapon;
      t.ammo = ammoIn(s.ammo);
    });
    wind = snap.wind;
    currentPlayer = snap.currentPlayer;
    state = snap.state;
    heli = snap.heli ? { ...(heli || {}), ...snap.heli, seen: (heli && heli.seen) || new Set() } : null;
    projectiles = [];
    clusterQueue = [];
    setWind();
    wind = snap.wind; // setWind rolls a fresh value; the snapshot is authority
    updateHUD();
    syncControlsFromTank();
  }

  /**
   * Publish how a turn ended. `actor` is the seat that *took* the turn, which
   * by this point is no longer `currentPlayer` — the turn has already moved on.
   */
  function netPublishTurn(actor) {
    if (!netPlaying() || actor !== online.seat) return;
    netSend('sync', { state: netSnapshot() });
  }

  function netLeave() {
    if (online.ws) online.ws.close();
  }

  onlineHostBtn.addEventListener('click', () => netConnect(null));
  onlineJoinBtn.addEventListener('click', () => {
    const code = (onlineCodeInput.value || '').trim().toUpperCase();
    if (code.length) netConnect(code);
  });

  // ---------- Boot ----------
  // The canvas is sized entirely in resize() now, so missing a size change
  // leaves the playfield visibly wrong rather than merely blurry — the old
  // width:100% canvas used to paper over a late measurement. Watching the box
  // itself catches every cause (orientation, browser chrome, a layout shift,
  // a wrapping control row), not just the ones that raise a window event.
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(resize).observe(gameWrap);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 150));
  // Mobile browsers resize the visual viewport when the address bar hides/shows
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  resize();
  buildInfo.textContent = BUILD;
  pruneWeaponOptions();
  initLanguage();
  refreshOpponentUi();
  resetGame();
  requestAnimationFrame(step);
  // iOS Safari can report stale/zero layout on first paint; re-measure shortly after.
  setTimeout(resize, 60);
  setTimeout(resize, 400);
  window.addEventListener('load', resize);

  // ---------- Test seam ----------
  // The game is one IIFE inside one file (it ships as a single self-contained
  // page), so tests/ reaches in through here to drive the physics, the AI and
  // the turn machinery directly. Nothing in the game itself reads this object.
  window.__BARRAGE_TEST__ = {
    BUILD, WEAPONS, MISSILE, DIFFICULTY_SETTINGS, GRAVITY, TANK_W, TANK_H, MAX_HP,
    WIND_MAX, MAX_PLAYERS, THEMES, SIM_W, SIM_H,
    groundHeightAt, craterAt, bedrockY, newTerrain, buildTerrainFromShape,
    placeTanks, levelTankPads, groundGradientAt, buildTanks,
    freshAmmo, weaponEnabled, weaponAvailable, syncWeaponOptions, pruneWeaponOptions,
    fire, applyDamageAndCrater, stepProjectile, stepRoller, detonateRoller, splitMirv,
    armMissile, flyMissile, missileFuzed, predictLandingX, traceShot, step, resize,
    endTurnCheckWin, nextTurn, resetGame, maybeAiTurn, chooseAiShot, aiFireDelayMs,
    setWind, windStrength, windForce, isAi, txt, upper, playerName,
    online, netSnapshot, netApplyState, netConnect, netHandle, netRemoteSeat,
    netPlaying, NET_PROTOCOL,
    setSocketFactory(fn) { socketFactory = fn; },
    el2: { onlineHostBtn, onlineJoinBtn, onlineCodeInput, onlineStatus },
    syncControlsFromTank, updateHUD, nudge,
    heliSize, spawnHeli, heliHitBy, heliCrash, updateHeli, summonHeli,
    el: {
      weaponSelect, modeSelect, countSelect, difficultySelect, angleSlider,
      powerSlider, angleVal, powerVal, fireBtn, overlay, turnBanner, ammoReadout,
      nudgeBtns, cards, hpText, langCheckbox
    },
    get tanks() { return tanks; }, set tanks(v) { tanks = v; },
    get terrain() { return terrain; }, set terrain(v) { terrain = v; },
    get wind() { return wind; }, set wind(v) { wind = v; },
    get state() { return state; }, set state(v) { state = v; },
    get currentPlayer() { return currentPlayer; }, set currentPlayer(v) { currentPlayer = v; },
    get projectiles() { return projectiles; }, set projectiles(v) { projectiles = v; },
    get clusterQueue() { return clusterQueue; }, set clusterQueue(v) { clusterQueue = v; },
    get heli() { return heli; }, set heli(v) { heli = v; },
    get cpuMode() { return cpuMode; }, set cpuMode(v) { cpuMode = v; },
    get aiDifficulty() { return aiDifficulty; }, set aiDifficulty(v) { aiDifficulty = v; },
    get playerCount() { return playerCount; }, set playerCount(v) { playerCount = v; },
    get lang() { return lang; },
    get W() { return W; }, get H() { return H; }, get physScale() { return physScale; },
    get viewScale() { return viewScale; }, get viewW() { return viewW; }, get viewH() { return viewH; },
    get turnToken() { return turnToken; }, get lastWinner() { return lastWinner; },
    get shotExploded() { return shotExploded; },
    get explosions() { return explosions; }, get particles() { return particles; }
  };
})();
</script>
</body>
</html>

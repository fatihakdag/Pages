name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # No install step for the games: both suites run the page out of its own
      # index.html against a stub DOM on Node's built-in test runner.
      - name: single-player
        run: node --test "tests/*.test.mjs"
      - name: multiplayer
        run: node --test "multiplayer/tests/*.test.mjs"
      # The relay is the one part with a dependency, so it installs its own.
      - name: relay
        run: npm --prefix multiplayer/server ci && npm --prefix multiplayer/server test

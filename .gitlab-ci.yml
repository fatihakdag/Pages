stages:
  - test
  - deploy

test:
  stage: test
  image: node:22-alpine
  script:
    # No dependencies for the games: each suite runs its own index.html against
    # a stub DOM on Node's built-in test runner.
    - node --test "tests/*.test.mjs"
    - node --test "multiplayer/tests/*.test.mjs"
    # The relay is the one part with a dependency, so it installs its own.
    - npm --prefix multiplayer/server ci
    - npm --prefix multiplayer/server test

pages:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Publishing static site"
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - test
  - deploy

test:
  stage: test
  image: node:22-alpine
  script:
    # No dependencies: the suite runs the game from index.html against a stub
    # DOM on Node's built-in test runner.
    - node --test "tests/*.test.mjs"

pages:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Publishing static site"
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

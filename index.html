  // shell under two tank widths — inside the blast radius, so wind was
  // ignorable. 120 overshot the other way and made every round a fight against
  // the weather. 80 puts a typical shot's drift at ~1.3 tank widths and a
  // worst case at ~2.6: worth aiming off for, not worth dreading.
  const WIND_MAX = 80;
  function windStrength() { return Math.min(1, Math.abs(wind) / WIND_MAX); }
  // px/s^2 is an internal unit and only means anything next to GRAVITY, so it
  // is never shown. Players get a 0-10 force instead; 0 reads as calm.
  function windForce() { return Math.round(windStrength() * 10); }
  function windColor() {
    const s = windStrength();
    if (s > 0.58) return '#ff6b6b';
    if (s > 0.28) return '#ffc44d';
    return '#8fe3a8';
  }

  // Round clock. Frozen once the round is over so it reads as how long it took,
  // and only written when the displayed second actually changes.
  function updateTimer() {
    if (state === 'GAMEOVER') return;
    const secs = Math.floor((performance.now() - roundStart) / 1000);
    const s = secs >= 60
      ? txt('timerMs', { m: Math.floor(secs / 60), s: secs % 60 })
      : txt('timerS', { s: secs });
    if (s !== lastTimerText) { lastTimerText = s; timerVal.textContent = s; }
  }

  function setWind() {
    wind = (Math.random() * 2 - 1) * WIND_MAX;
    const col = windColor();
    windVal.textContent = windForce() + '/10';
    windArrow.textContent = wind >= 0 ? '→' : '←';
    windArrow.style.color = col;
    windVal.style.color = col;
    windPulse = 1; // flash the on-canvas gauge so a new wind isn't missed
  }

  function resetGame() {
    turnToken++;
    roundStart = performance.now();
    lastTimerText = '';
    buildTanks();
    currentPlayer = 0;
    state = 'AIMING';
    projectiles = [];
    shotExploded = false;
    explosions = [];
    particles = [];
    heli = null;
    stopAllSound(); // a round can end mid-burn; nothing sustained may survive it
    nextTheme();
    newTerrain();
    placeTanks();
    setWind();
    updateHUD();
    overlay.classList.remove('show');
    syncControlsFromTank();
    maybeAiTurn();
  }

  function updateHUD() {
    playersRow.dataset.count = tanks.length;
    for (let i = 0; i < MAX_PLAYERS; i++) {
      const t = tanks[i];
      cards[i].hidden = !t;
      if (!t) continue;
      const pct = Math.max(0, t.hp / MAX_HP * 100);
      hpFill[i].style.width = pct + '%';
      hpText[i].textContent = `${Math.max(0, Math.round(t.hp))} / ${MAX_HP}`;
      cards[i].classList.toggle('active', currentPlayer === i && state === 'AIMING');
      cards[i].classList.toggle('dead', !t.alive);
      aiBadges[i].style.display = isAi(i) ? 'inline-block' : 'none';
    }
    if (state === 'GAMEOVER') {
      turnBanner.textContent = txt('roundOver');
    } else if (state !== 'AIMING') {
      turnBanner.textContent = txt('inFlight');
    } else {
      const who = upper(playerName(currentPlayer));
      turnBanner.textContent = txt(isAi(currentPlayer) ? 'thinking' : 'aimFire', { name: who });
    }
  }

  // The angle is world space - 0 is due right - but the slider is a spatial
  // control: dragging left has to swing the barrel left. So the slider carries
  // the mirrored value and both directions convert here and in its listener.
  // Do not "simplify" the 180 - away.
  function angleToSlider(angle) { return 180 - angle; }
  function sliderToAngle(value) { return 180 - value; }

  function syncControlsFromTank() {
    const t = tanks[currentPlayer];
    angleSlider.value = angleToSlider(t.angle);
    // The slider's own value is mirrored, so spell the real angle out for
    // assistive tech rather than letting it read the position back.
    angleSlider.setAttribute('aria-valuetext', t.angle + '°');
    powerSlider.value = t.power;
    angleVal.textContent = t.angle + '°';
    powerVal.textContent = t.power;
    const isAiTurn = isAi(currentPlayer);
    fireBtn.disabled = (state !== 'AIMING') || isAiTurn;
    angleSlider.disabled = isAiTurn;
    powerSlider.disabled = isAiTurn;
    nudgeBtns.forEach(b => { b.disabled = isAiTurn; });
    // The weapon is a turn control like the sliders, not a game setting: on a
    // CPU seat the select is showing that seat's choice, so leaving it live let
    // a player reach in and change what the computer was about to fire.
    weaponSelect.disabled = isAiTurn;
    // The three game settings freeze while a CPU seat is actually playing, but
    // not once the round is over — the round may well have ended on a CPU seat,
    // and the roster and difficulty are exactly what you want to change before
    // hitting Play Again.
    const aiHoldsTurn = isAiTurn && state !== 'GAMEOVER';
    countSelect.disabled = aiHoldsTurn;
    modeSelect.disabled = aiHoldsTurn;
    difficultySelect.disabled = aiHoldsTurn;
    syncWeaponOptions(t);
  }

  function syncWeaponOptions(t) {
    for (const opt of weaponSelect.options) {
      const key = opt.value;
      const remaining = t.ammo[key];
      const label = txt('w_' + key);
      opt.textContent = remaining === Infinity ? `${label} (∞)` : `${label} (${remaining})`;
      opt.disabled = remaining <= 0;
    }
    // The select is one control shared by every seat, so it is restored from
    // whoever is aiming rather than left holding the last player's pick — the
    // same way the angle and power sliders are. A choice that has since run dry
    // (or been switched off) falls back to the standard shell.
    if (!weaponAvailable(t, t.weapon)) t.weapon = 'standard';
    weaponSelect.value = t.weapon;
    const curRemaining = t.ammo[t.weapon];
    ammoReadout.textContent = curRemaining === Infinity ? txt('unlimited') : txt('nLeft', { n: curRemaining });
  }

  angleSlider.addEventListener('input', () => {
    const angle = sliderToAngle(parseInt(angleSlider.value, 10));
    tanks[currentPlayer].angle = angle;
    angleVal.textContent = angle + '°';
    angleSlider.setAttribute('aria-valuetext', angle + '°');
  });
  powerSlider.addEventListener('input', () => {
    tanks[currentPlayer].power = parseInt(powerSlider.value, 10);
    powerVal.textContent = powerSlider.value;
  });

  // Arrow buttons either side of each slider: a slider alone can't reliably
  // pick one degree out of 180, especially with a fingertip.
  function nudge(which, delta) {
    if (isAi(currentPlayer)) return; // same condition that gates the sliders
    Sound.tick();
    const t = tanks[currentPlayer];
    if (which === 'angle') t.angle = Math.max(0, Math.min(180, t.angle + delta));
    else t.power = Math.max(0, Math.min(100, t.power + delta));
    syncControlsFromTank();
  }

  const nudgeBtns = [], nudgeStops = [];
  function bindNudge(id, which, delta) {
    const btn = document.getElementById(id);
    nudgeBtns.push(btn);
    let holdTimer = null, repeatTimer = null;
    const stop = () => {
      clearTimeout(holdTimer);
      clearInterval(repeatTimer);
      holdTimer = repeatTimer = null;
    };
    nudgeStops.push(stop);
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault(); // don't let a touch turn into a scroll or a zoom
      nudge(which, delta);
      holdTimer = setTimeout(() => {
        repeatTimer = setInterval(() => nudge(which, delta), 55);
      }, 380);
    });
    for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) {
      btn.addEventListener(ev, stop);
    }
    // detail === 0 means the click came from the keyboard, which fires no
    // pointer events at all; without this the buttons would be pointer-only.
    btn.addEventListener('click', (e) => { if (e.detail === 0) nudge(which, delta); });
  }
  // Left button aims left, which is *up* in world degrees.
  bindNudge('angle-left', 'angle', 1);
  bindNudge('angle-right', 'angle', -1);
  bindNudge('power-dec', 'power', -1);
  bindNudge('power-inc', 'power', 1);
  // a press held while the tab loses focus would otherwise repeat forever
  window.addEventListener('blur', () => nudgeStops.forEach(fn => fn()));

  window.addEventListener('keydown', (e) => {
    // Arrows on the focused SFX slider belong to the slider, not the aim.
    if (e.target === sfxSlider) return;
    if (state !== 'AIMING' || isAi(currentPlayer)) return;
    const t = tanks[currentPlayer];
    if (e.key === 'ArrowLeft') { t.angle = Math.min(180, t.angle + 1); syncControlsFromTank(); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { t.angle = Math.max(0, t.angle - 1); syncControlsFromTank(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { t.power = Math.min(100, t.power + 2); syncControlsFromTank(); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { t.power = Math.max(0, t.power - 2); syncControlsFromTank(); e.preventDefault(); }
    else if (e.code === 'Space') { fire(); e.preventDefault(); }
  });

  fireBtn.addEventListener('click', fire);
  restartBtn.addEventListener('click', resetGame);

  function fire() {
    if (state !== 'AIMING') return;
    const shooter = tanks[currentPlayer];
    let weaponKey = shooter.weapon;
    if (!weaponAvailable(shooter, weaponKey)) weaponKey = 'standard'; // safety net; syncWeaponOptions gets there first
    shooter.ammo[weaponKey] -= 1;
    // Spending the last round hands this tank back to the standard shell, so
    // its next turn does not open on something it cannot fire.
    if (!weaponAvailable(shooter, weaponKey)) shooter.weapon = 'standard';
    const angleRad = shooter.angle * Math.PI / 180;
    // Angles are in world space for every tank: 0° = due right, 180° = due left.
    const speed = shooter.power * 6.2 * physScale;
    const vx = Math.cos(angleRad) * speed;
    const vy = -Math.sin(angleRad) * speed;
    const barrelLen = 20;
    projectiles = [{
      x: shooter.x + barrelLen * Math.cos(angleRad),
      y: groundHeightAt(shooter.x) - TANK_H - barrelLen * Math.sin(angleRad),
      vx, vy,
      weapon: weaponKey,
      firedBy: currentPlayer,
      // Where an ordinary shell of this angle and power would have come down.
      // A missile cruises to this spot and drops on it, so the aim you have
      // built up on every other shell carries over unchanged; only the angle of
      // arrival differs. (predictLandingX also sets predictHitHeli, which only
      // the AI solver reads, and only straight after its own call.)
      aimX: WEAPONS[weaponKey].guides
        ? predictLandingX(shooter.x + barrelLen * Math.cos(angleRad),
                          groundHeightAt(shooter.x) - TANK_H - barrelLen * Math.sin(angleRad),
                          shooter.angle, shooter.power, wind)
        : 0,
      trail: []
    }];
    shotExploded = false;
    Sound.fire(shooter.power, currentPlayer, shooter.x / W);
    state = 'FIRING';
    updateHUD();
  }

  // How far a blast at (px, py) is from a tank: measured to the nearest point of
  // the hull's height, not just its roof, so a burst at the tracks is as close
  // as one on top of the turret. Every blast in the game measures with this.
  function hullDistance(t, px, py) {
    const groundY = groundHeightAt(t.x);
    const topY = groundY - TANK_H;
    const dx = t.x - px;
    const dy = py < topY ? topY - py : Math.max(0, py - groundY);
    return Math.sqrt(dx * dx + dy * dy);
  }

  function applyDamageAndCrater(px, py, weaponKey) {
    const w = WEAPONS[weaponKey];
    // Compute damage using terrain heights BEFORE cratering — otherwise a
    // close/direct hit carves the ground out from under the tank first,
    // which makes the tank look farther from the blast than it really was
    // and under-credits exactly the hits that should do the most damage.
    for (const t of tanks) {
      if (!t.alive) continue;
      const dist = hullDistance(t, px, py);
      if (dist < w.radius) {
        const falloff = 1 - dist / w.radius;
        const dmg = w.damageMax * falloff;
        t.hp -= dmg;
        if (t.hp <= 0) { t.hp = 0; t.alive = false; Sound.destroyed(t.x / W); }
      }
    }
    craterAt(px, py, w.radius);
    spawnExplosionFx(px, py, w.radius, w.color);
  }

  function spawnExplosionFx(x, y, radius, color) {
    Sound.explode(radius, x / W); // the one place every blast in the game passes through
    explosions.push({ x, y, r: 4, maxR: radius * 1.15, t: 0, color });
    const count = Math.round(radius * 0.9);
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 40 + Math.random() * 140;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 60,
        life: 0.5 + Math.random() * 0.5,
        age: 0,
        color: Math.random() < 0.5 ? color : '#fff2c9'
      });
    }
  }

  function endTurnCheckWin() {
    const alive = tanks.filter(t => t.alive);
    if (alive.length <= 1) {
      state = 'GAMEOVER';
      lastWinner = tanks.findIndex(tk => tk.alive);
      refreshOverlayText();
      overlay.classList.add('show');
      updateHUD();
      syncControlsFromTank(); // releases the settings the CPU seat was holding
      return true;
    }
    return false;
  }

  function nextTurn() {
    if (endTurnCheckWin()) return;
    // at least two tanks are alive here, so this always lands on someone else
    do { currentPlayer = (currentPlayer + 1) % tanks.length; }
    while (!tanks[currentPlayer].alive);
    turnToken++;
    if (heli) heli.seen.add(currentPlayer); // this player now gets a crack at it
    setWind();
    state = 'AIMING';
    updateHUD();
    syncControlsFromTank();
    maybeAiTurn();
  }

  // ---------- AI: trajectory-solving aim, scaled by difficulty ----------
  // heliChance   - how often it goes for the helicopter at all when one is up
  // heliPatience - how often it holds fire unless the wreck would land on someone
  // heli*Jitter  - absolute aim error for that shot, deliberately far wider than
  //                the tank jitter above, so even Brutal mostly misses a target
  //                this small and moving
  const DIFFICULTY_SETTINGS = {
    easy:    { angleStep: 6, powerStep: 6,  angleJitter: 16, powerJitter: 22, missChance: 0.30, thinkMs: 900,
               heliChance: 0.30, heliPatience: 0.15, heliAngleJitter: 14, heliPowerJitter: 18 },
    medium:  { angleStep: 3, powerStep: 3,  angleJitter: 7,  powerJitter: 10, missChance: 0.12, thinkMs: 750,
               heliChance: 0.30, heliPatience: 0.40, heliAngleJitter: 10, heliPowerJitter: 13 },
    hard:    { angleStep: 1.5, powerStep: 1.5, angleJitter: 3,  powerJitter: 4,  missChance: 0.04, thinkMs: 600,
               heliChance: 0.30, heliPatience: 0.65, heliAngleJitter: 7,  heliPowerJitter: 9 },
    brutal:  { angleStep: 1, powerStep: 1,  angleJitter: 0.5, powerJitter: 1,  missChance: 0,    thinkMs: 450,
               heliChance: 0.30, heliPatience: 0.85, heliAngleJitter: 3,  heliPowerJitter: 4 }
  };

  // Simulates a shot with the same physics as the real game and returns
  // where it would land (x coordinate), so the AI can search for the
  // angle/power combo that actually lands on the target.
  // Set by the last predictLandingX call: the shot stopped on the helicopter
  // rather than on the ground. A module-level flag rather than a returned
  // object because this runs thousands of times per turn.
  let predictHitHeli = false;

  function predictLandingX(x0, y0, angleDeg, power, windAccel) {
    const angleRad = angleDeg * Math.PI / 180;
    let vx = Math.cos(angleRad) * power * 6.2 * physScale;
    let vy = -Math.sin(angleRad) * power * 6.2 * physScale;
    let x = x0, y = y0, t = 0;
    const dt = 0.03;
    predictHitHeli = false;
    // The real shot stops on the airframe, so a prediction that flies straight
    // through it would have the AI picking shots that get intercepted. Bounds
    // are hoisted out of the loop; this is the hottest code in the game.
    const live = heli && !heli.falling;
    const hx = live ? heli.x : 0, hy = live ? heli.y : 0;
    const hw = live ? heliSize() * 0.55 : 0, hh = live ? heliSize() * 0.30 : 0;
    // Lead the target. The shell lands one to three seconds after launch, and
    // the AI fires a further fraction of a second after solving, by which time
    // the helicopter has moved several times its own width. Checking against
    // where it is now rather than where it will be made hitting it impossible
    // and left the difficulty knobs doing nothing at all.
    const hVel = live ? heli.dir * heli.speed : 0;
    const hLead = live ? aiFireDelaySec() : 0;
    while (t < 12) {
      vx += windAccel * physScale * dt;
      vy += GRAVITY * physScale * dt;
      x += vx * dt;
      y += vy * dt;
      t += dt;
      if (live && Math.abs(x - (hx + hVel * (hLead + t))) < hw && Math.abs(y - hy) < hh) { predictHitHeli = true; break; }
      if (x < -80 || x > W + 80) break;
      if (y >= groundHeightAt(Math.max(0, Math.min(terrain.length - 1, x)))) break;
    }
    return x;
  }

  // Brutal is very hard to out-shoot, so at that level both sides get to see
  // the arc before it is fired. This traces with the same integrator step()
  // uses — sub-stepped at a 60fps dt rather than predictLandingX's coarser
  // single step — so the drawn line matches where the shell actually goes.
  function traceShot(x0, y0, angleDeg, power, windAccel) {
    const a = angleDeg * Math.PI / 180;
    const speed = power * 6.2 * physScale;
    let vx = Math.cos(a) * speed, vy = -Math.sin(a) * speed;
    let x = x0, y = y0;
    const pts = [[x, y]];
    const dt = 1 / 60, sub = 2;
    for (let i = 0; i < 900; i++) {
      for (let s = 0; s < sub; s++) {
        const sdt = dt / sub;
        vx += windAccel * physScale * sdt;
        vy += GRAVITY * physScale * sdt;
        x += vx * sdt;
        y += vy * sdt;
      }
      pts.push([x, y]);
      if (x < -20 || x > W + 20 || y > H + 60) break;
      if (y >= groundHeightAt(x)) break;
    }
    return pts;
  }

  function aimPreviewOn() { return cpuMode && aiDifficulty === 'brutal'; }

  // Gap between the AI solving its shot and actually firing. Shared so the
  // lead used when aiming can't drift away from the real delay.
  function aiFireDelayMs() { return aimPreviewOn() ? 900 : 350; }
  function aiFireDelaySec() { return aiFireDelayMs() / 1000; }

  function chooseAiShot(difficulty) {
    const cfg = DIFFICULTY_SETTINGS[difficulty] || DIFFICULTY_SETTINGS.medium;
    const shooter = tanks[currentPlayer];
    const targets = tanks.filter((t, i) => t.alive && i !== currentPlayer);
    const barrelLen = 20;
    let bestAngle = 45, bestPower = 55, bestErr = Infinity;
    let bestHeliAngle = 45, bestHeliPower = 55, bestHeliErr = Infinity;

    // Sweep the full 0-180 arc: with more than two tanks an enemy can be on
    // either side. A landing spot is scored against whichever enemy it is
    // closest to, so the AI naturally picks the target it can actually reach.
    for (let angle = 8; angle <= 172; angle += cfg.angleStep) {
      const angleRad = angle * Math.PI / 180;
      const y0 = groundHeightAt(shooter.x) - TANK_H - barrelLen * Math.sin(angleRad);
      for (let power = 15; power <= 100; power += cfg.powerStep) {
        const landX = predictLandingX(shooter.x, y0, angle, power, wind);
        if (Math.abs(landX - shooter.x) < TANK_W) continue; // don't shell yourself
        if (predictHitHeli) {
          // This shot is stopped by the airframe, so it can never reach a tank:
          // keep it out of the tank scoring (that alone is the dodge), and hold
          // on to the best one in case we decide to go hunting below.
          let herr = Infinity;
          for (const t of targets) herr = Math.min(herr, Math.abs(landX - t.x));
          if (herr < bestHeliErr) {
            bestHeliErr = herr;
            bestHeliAngle = angle;
            bestHeliPower = power;
          }
          continue;
        }
        let err = Infinity;
        for (const t of targets) err = Math.min(err, Math.abs(landX - t.x));
        if (err < bestErr) {
          bestErr = err;
          bestAngle = angle;
          bestPower = power;
        }
      }
    }

    // Difficulty-scaled human-like imprecision on top of the solved shot.
    let jitterAngle = cfg.angleJitter;
    let jitterPower = cfg.powerJitter;

    // Sometimes go for the helicopter instead, and go for it badly: a much
    // wider aim error than any tank shot, and at the lower levels it will take
    // the shot even when the wreck would come down nowhere near anybody.
    if (heli && !heli.falling && bestHeliErr < Infinity && Math.random() < cfg.heliChance) {
      const overSomeone = bestHeliErr < 70; // wreck would come down on someone
      if (overSomeone || Math.random() > cfg.heliPatience) {
        bestAngle = bestHeliAngle;
        bestPower = bestHeliPower;
        jitterAngle = cfg.heliAngleJitter;
        jitterPower = cfg.heliPowerJitter;
      }
    }

    if (Math.random() < cfg.missChance) {
      // occasional bigger miss, more likely at lower difficulty
      jitterAngle *= 2.5;
      jitterPower *= 2.5;
    }
    const finalAngle = Math.max(5, Math.min(175, bestAngle + (Math.random() * 2 - 1) * jitterAngle));
    const finalPower = Math.max(10, Math.min(100, bestPower + (Math.random() * 2 - 1) * jitterPower));
    return { angle: Math.round(finalAngle), power: Math.round(finalPower) };
  }

  // A CPU seat has no meaningful aim until it has solved its shot, so the
  // preview stays hidden while it is still "thinking".
  let cpuAimReady = false;

  // Bumped whenever the active seat changes, a round restarts, or the opponent
  // mode changes. The AI defers both its aim and its shot on timers, and a
  // helicopter crash can end a turn from outside the normal shot resolution, so
  // a deferred shot could otherwise land after the turn had moved on - and
  // fire() shoots for whoever is current, which meant the human's tank firing
  // by itself.
  let turnToken = 0;

  // First entry whose threshold r falls under, else the fallback.
  function pick(r, table, fallback) {
    for (const [threshold, key] of table) if (r < threshold) return key;
    return fallback;
  }

  function maybeAiTurn() {
    if (!isAi(currentPlayer) || state !== 'AIMING') return;
    cpuAimReady = false;
    updateHUD();
    const cfg = DIFFICULTY_SETTINGS[aiDifficulty] || DIFFICULTY_SETTINGS.medium;
    const seat = currentPlayer;
    const token = turnToken;
    const stillOurTurn = () =>
      turnToken === token && state === 'AIMING' && currentPlayer === seat;
    setTimeout(() => {
      if (!stillOurTurn()) return;
      const shot = chooseAiShot(aiDifficulty);
      const shooter = tanks[seat];
      shooter.angle = shot.angle;
      shooter.power = shot.power;
      // Stronger CPU levels lean on the bigger/smarter weapons more often,
      // but only when it actually still has ammo for them.
      const r = Math.random();
      let preferred;
      // Thresholds are cumulative: each level leans further from the plain
      // shell toward the specials, and a MIRV forgives a rough solution, so
      // the weaker levels get proportionally more use out of it.
      // The guided missile is deliberately absent: chooseAiShot solves on
      // predictLandingX, which integrates a plain parabola, and a missile
      // stops travelling at apex — so the CPU would undershoot every one of
      // them. Teaching the predictor about the burn is what it would take.
      if (aiDifficulty === 'easy') {
        preferred = pick(r, [[0.80, 'standard'], [0.86, 'big'], [0.91, 'cluster'], [0.95, 'roller']], 'mirv');
      } else if (aiDifficulty === 'medium') {
        preferred = pick(r, [[0.58, 'standard'], [0.72, 'big'], [0.83, 'cluster'], [0.92, 'roller']], 'mirv');
      } else {
        preferred = pick(r, [[0.38, 'standard'], [0.56, 'big'], [0.72, 'cluster'], [0.88, 'roller']], 'mirv');
      }
      shooter.weapon = weaponAvailable(shooter, preferred) ? preferred : 'standard';
      syncControlsFromTank(); // pushes the seat's choice into the shared select
      cpuAimReady = true;
      // hold a beat longer when the arc is on screen, so it can be read
      setTimeout(() => { if (stillOurTurn()) fire(); }, aiFireDelayMs());
    }, cfg.thinkMs);
  }

  // ---------- Roller mine ----------
  // Ground gradient at x, sampled over a few pixels so single-pixel terrain
  // noise doesn't shove the mine around. Canvas y grows downward, so a positive
  // gradient means the ground falls away to the right.
  function groundGradientAt(x) {
    const d = 4 * physScale;
    return (groundHeightAt(x + d) - groundHeightAt(x - d)) / (2 * d);
  }

  function spawnDust(x, y, color) {
    for (let i = 0; i < 8; i++) {
      particles.push({
        x, y,
        vx: (Math.random() * 2 - 1) * 60,
        vy: -Math.random() * 70,
        life: 0.3 + Math.random() * 0.3,
        age: 0,
        color: Math.random() < 0.5 ? color : '#cbd5e1'
      });
    }
  }

  function detonateRoller(p) {
    applyDamageAndCrater(p.x, groundHeightAt(p.x), p.weapon);
    p.dead = true;
    shotExploded = true;
    updateHUD();
  }

  // The mine hugs the surface: gravity along the slope pushes it downhill,
  // friction bleeds the speed off, and it detonates as soon as it reaches a
  // tank, stalls, times out or falls off the map.
  function stepRoller(p, dt) {
    p.rollTime += dt;

    const sub = 3;
    for (let i = 0; i < sub; i++) {
      const sdt = dt / sub;
      p.vx += groundGradientAt(p.x) * ROLL_ACCEL * physScale * sdt;
      p.vx *= Math.pow(ROLL_FRICTION, sdt);
      const nx = p.x + p.vx * sdt;
      // Small lips are allowed so a crater rim or a tank pad's edge doesn't
      // catch it; anything steeper is a cliff.
      const limit = ROLL_MAX_SLOPE * Math.max(1, Math.abs(nx - p.x)) + 2 * physScale;
      const rise = p.y - groundHeightAt(nx); // positive: the ground ahead is higher
      if (rise > limit) {
        // A wall: it knocks back off the face rather than riding straight up
        // it, and stalls at the foot.
        p.vx *= -0.2;
        continue;
      }
      if (-rise > limit) {
        // Over a ledge: it falls as a shell and settles again where it lands.
        p.x = nx;
        p.vy = 0;
        p.rolling = false;
        p.trail = [];
        return;
      }
      p.x = nx;
      p.y = groundHeightAt(p.x);
    }

    pushTrail(p);

    if (p.x < -20 || p.x > W + 20) {
      p.dead = true; // rolled off the edge of the map
      return;
    }
    for (const t of tanks) {
      if (!t.alive) continue;
      if (Math.abs(p.x - t.x) < TANK_W / 2 + 4) { detonateRoller(p); return; } // yes, including the tank that fired it
    }
    if (p.rollTime > ROLL_MAX_TIME ||
        (p.rollTime > 0.25 && Math.abs(p.vx) < ROLL_MIN_SPEED * physScale)) {
      detonateRoller(p);
    }
  }

  // ---------- MIRV ----------
  // Splits at the top of the arc — vy crossing zero — into evenly fanned
  // warheads. They are ordinary shells from here on, marked so they can't
  // split again, so wind bends each one on its own the rest of the way down.
  function splitMirv(p) {
    const w = WEAPONS.mirv;
    p.dead = true;
    for (let i = 0; i < w.mirvCount; i++) {
      const offset = i - (w.mirvCount - 1) / 2; // -1, 0, +1 for three
      spawnQueue.push({
        x: p.x, y: p.y,
        vx: p.vx + offset * w.mirvSpread * physScale,
        // a touch of downward kick, so they separate vertically too
        vy: p.vy + Math.abs(offset) * 18 * physScale,
        weapon: 'mirv',
        firedBy: p.firedBy,
        split: true,
        trail: []
      });
    }
    spawnDust(p.x, p.y, w.color);
  }

  // ---------- Cluster bomb ----------
  // The casing bursts on impact and throws its bomblets up and out of the
  // crater, fanned like a MIRV's warheads. From there they are ordinary shells:
  // they fly, drift with the wind and burst on whatever they come down on —
  // including a cliff face beside the crater — and they cannot scatter again.
  function scatterBomblets(p, x, y) {
    const w = WEAPONS[p.weapon];
    for (let i = 0; i < w.clusterCount; i++) {
      const offset = i - (w.clusterCount - 1) / 2; // -2 .. +2 for five
      spawnQueue.push({
        x, y,
        vx: (offset * 32 + (Math.random() * 2 - 1) * 12) * physScale,
        vy: -(150 + Math.random() * 70) * physScale,
        weapon: p.weapon,
        firedBy: p.firedBy,
        bomblet: true,
        age: 0,
        trail: []
      });
    }
  }

  // ---------- Guided missile ----------
  // The motor lights at the top of the arc — the same moment a MIRV splits —
  // so the climb is whatever the player aimed and only the descent changes.
  function armMissile(p) {
    p.armed = true;
    p.burnLeft = MISSILE.burn;
    // Apex sits at half of a ballistic shot's range, so cruising the same
    // horizontal distance again before tipping over lands the missile where an
    // ordinary shell of the same angle and power would have landed. Measured
    // rather than set as a constant: range scales with the square of power, so
    // no fixed cruise time can hold across the power range or across screen
    // sizes. This is what makes the weapon aimable on instinct.
    p.armX = p.x;
    // Locked once, here: a helicopter that shows up later isn't chased, and one
    // that is shot down or leaves mid-burn drops the missile back into its dive.
    p.chase = !!(heli && !heli.falling);
    // At apex a steep shot has almost no speed left, so the motor sets a floor
    // rather than preserving what little is there.
    p.burnSpeed = Math.max(Math.hypot(p.vx, p.vy), MISSILE.boostSpeed * physScale);
    spawnDust(p.x, p.y, WEAPONS.missile.color);
  }

  // How much ground the dive still to come will cover: the geometry of the drop
  // itself, plus the swing into it, which is not free at a capped turn rate.
  // Cruising until this equals the distance left is what puts the missile on the
  // aim point instead of well beyond it.
  function diveRunFor(p) {
    const gy = groundHeightAt(Math.max(0, Math.min(W - 1, p.aimX)));
    const drop = Math.max(0, gy - p.y);
    const turnIn = p.burnSpeed * (MISSILE.diveAngle / MISSILE.turnRate) * 0.5;
    return drop / Math.tan(MISSILE.diveAngle * Math.PI / 180) + turnIn;
  }

  // Under power: no gravity, no wind (the motor overpowers both), constant
  // speed, and the nose swings toward what it wants at a capped rate.
  function flyMissile(p, dt) {
    p.burnLeft -= dt;
    const target = (p.chase && heli && !heli.falling) ? heli : null;
    let want;
    if (target) {
      const lead = target.dir * target.speed * MISSILE.heliLead;
      want = Math.atan2(target.y - p.y, (target.x + lead) - p.x);
    } else if (!p.diving && Math.abs(p.aimX - p.x) > diveRunFor(p)) {
      // Cruise: hold altitude until the dive ahead will just reach the aim point.
      want = p.vx >= 0 ? 0 : Math.PI;
    } else {
      // Committed. Steering at the aim point itself rather than holding a fixed
      // angle lets the dive absorb the error in diveRunFor's estimate, which is
      // only ever approximate — the swing into the dive is not free and the
      // ground under the target is not flat. The trigger above is what makes
      // this steep; this only decides where it ends up. Latched, because the
      // dive carries it across the aim point and the distance test would
      // otherwise go false on the far side and pull it out of the dive.
      p.diving = true;
      const gy = groundHeightAt(Math.max(0, Math.min(W - 1, p.aimX)));
      want = Math.atan2(Math.max(1, gy - p.y), p.aimX - p.x);
    }
    let cur = Math.atan2(p.vy, p.vx);
    let diff = want - cur;
    while (diff > Math.PI) diff -= Math.PI * 2;   // turn the short way round
    while (diff < -Math.PI) diff += Math.PI * 2;
    const step = MISSILE.turnRate * Math.PI / 180 * dt;
    cur += Math.max(-step, Math.min(step, diff));
    p.vx = Math.cos(cur) * p.burnSpeed;
    p.vy = Math.sin(cur) * p.burnSpeed;
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    if (Math.random() < 0.8) {
      particles.push({
        x: p.x - Math.cos(cur) * 6, y: p.y - Math.sin(cur) * 6,
        vx: (Math.random() * 2 - 1) * 26 - p.vx * 0.06,
        vy: (Math.random() * 2 - 1) * 26 - p.vy * 0.06,
        life: 0.25 + Math.random() * 0.35, age: 0,
        color: Math.random() < 0.5 ? '#ffb03a' : '#8e8b99'
      });
    }
  }

  // A chasing missile goes off when it gets close enough, rather than having to
  // thread the airframe's own hit box. Only a missile that locked on: everything
  // else still has to actually hit.
  function missileFuzed(p) {
    if (!p.chase || !heli || heli.falling) return false;
    const r = heliSize() * MISSILE.fuze;
    return Math.hypot(p.x - heli.x, p.y - heli.y) < r;
  }

  // ---------- Per-shell flight ----------
  // One shell for one frame: marks itself dead when it is spent, and leaves
  // the turn's bookkeeping to the caller — there may be two more in the air.
  let spawnQueue = []; // warheads spawned mid-frame, added once the walk is done

  function pushTrail(p) {
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 60) p.trail.shift();
  }

  // Walks a shell's path for one frame a pixel at a time and reports the first
  // thing on it. Testing only where the frame ends let a fast shell sink several
  // pixels into a cliff face before noticing, and the burst then went to the
  // surface of that column — the top of the cliff. It also let a shell step over
  // a thin peak. `px, py` is the last point in open air, which is where anything
  // that goes off on contact should go off.
  function firstContact(x0, y0, x1, y1) {
    const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0)));
    let px = x0, py = y0;
    for (let i = 1; i <= n; i++) {
      const x = x0 + (x1 - x0) * i / n;
      const y = y0 + (y1 - y0) * i / n;
      let what = null;
      if (x < -20 || x > W + 20 || y > H + 60) what = 'off';
      else if (heliHitBy(x, y)) what = 'heli';
      else if (y >= groundHeightAt(x)) what = 'ground';
      else {
        for (const t of tanks) {
          if (!t.alive) continue;
          const topY = groundHeightAt(t.x) - TANK_H;
          if (Math.abs(x - t.x) < TANK_W / 2 && y > topY - 4 && y < topY + TANK_H) { what = 'tank'; break; }
        }
      }
      if (what) return { what, x, y, px, py };
      px = x; py = y;
    }
    return null;
  }

  function stepProjectile(p, dt) {
    if (p.rolling) { stepRoller(p, dt); return; }

    const w = WEAPONS[p.weapon];
    p.age = (p.age || 0) + dt;
    const x0 = p.x, y0 = p.y;
    if (w.guides && p.burnLeft > 0) {
      flyMissile(p, dt);
    } else {
      const sub = 2;
      for (let s = 0; s < sub; s++) {
        const sdt = dt / sub;
        p.vx += wind * physScale * sdt;
        p.vy += GRAVITY * physScale * sdt;
        p.x += p.vx * sdt;
        p.y += p.vy * sdt;
      }
    }
    pushTrail(p);

    // Apex, by the same test the MIRV splits on. Once the burn is spent it
    // falls the rest of the way as an ordinary shell, wind and all.
    if (w.guides && !p.armed && p.vy >= 0 && p.age > MISSILE.armDelay) armMissile(p);

    // Apex: the frame the climb turns into a fall. A flat or downward shot
    // (angle 0 or 180) starts at vy 0 and has no apex, so the age floor is
    // what keeps those from splitting in the shooter's own lap.
    if (w.mirvCount && !p.split && p.vy >= 0 && p.age > 0.15) { splitMirv(p); return; }

    const c = firstContact(x0, y0, p.x, p.y);
    if (c && c.what === 'off') {
      p.dead = true; // off the map
      return;
    }
    if ((c && c.what === 'heli') || (!c && missileFuzed(p))) {
      if (c) { p.x = c.x; p.y = c.y; }
      // the shell bursts on the airframe; the wreck falls on its own from here
      spawnExplosionFx(p.x, p.y, 32, '#ffd27a');
      heli.falling = true;
      heli.vy = 20;
      p.dead = true;
      shotExploded = true;
      return;
    }
    if (!c) return;

    const px = c.px, py = c.py;
    if (w.rolls && c.what === 'ground') {
      if (groundHeightAt(px) - py > 4 * physScale) {
        // Struck a cliff face rather than landing: it glances off and drops to
        // the foot of the wall, where it settles like any other landing.
        p.x = px;
        p.y = py;
        p.vx *= -0.3;
        return;
      }
      // Landed on the ground rather than straight onto a tank: settle it on
      // the surface and hand it to the roll phase instead of detonating.
      p.rolling = true;
      p.rollTime = p.rollTime || 0; // a drop off a ledge doesn't restart its clock
      p.x = px;
      p.y = groundHeightAt(px);
      p.vy = 0;
      p.vx *= 0.45; // most of the impact energy goes into the dirt
      p.trail = [];
      spawnDust(p.x, p.y, w.color);
      return;
    }
    applyDamageAndCrater(px, py, p.weapon);
    if (w.clusterCount && !p.bomblet) scatterBomblets(p, px, py);
    p.dead = true;
    shotExploded = true;
    updateHUD();
  }

  // ---------- Physics step ----------
  let lastTime = null;
  function step(ts) {
    if (lastTime === null) lastTime = ts;
    let dt = (ts - lastTime) / 1000;
    dt = Math.min(dt, 0.033);
    lastTime = ts;

    if (state === 'FIRING') {
      for (const p of projectiles) stepProjectile(p, dt);
      // Warheads a MIRV split off, or bomblets a cluster bomb threw, join the
      // flight next frame, so the list isn't mutated while it is being walked.
      projectiles = projectiles.filter(p => !p.dead).concat(spawnQueue);
      spawnQueue = [];
      if (projectiles.length === 0) {
        // Nothing went off anywhere: the whole shot missed, so skip the
        // explosion wait and hand the turn straight on.
        state = shotExploded ? 'EXPLODING' : 'RESOLVED';
        explodeTimer = 0;
      }
    }

    if (state === 'EXPLODING') {
      explodeTimer += dt;
      updateHUD();
      if (explodeTimer > 0.9 && explosions.every(e => e.t > e.maxR / 90)) {
        state = 'RESOLVED';
      }
    }

    if (state === 'RESOLVED') {
      nextTurn();
    }

    // explosion fx aging
    explosions.forEach(e => { e.t += dt * 90; e.r = Math.min(e.maxR, 4 + e.t); });
    explosions = explosions.filter(e => e.r < e.maxR - 0.5);
    particles.forEach(p => {
      p.age += dt;
      p.vy += 220 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    });
    particles = particles.filter(p => p.age < p.life);
    windPulse = Math.max(0, windPulse - dt * 1.6);
    updateHeli(dt);
    updateSoundLoops();
    updateTimer();

    render();
    requestAnimationFrame(step);
  }
  let explodeTimer = 0;

  // ---------- Rendering ----------
  let decorClock = 0;

  function drawDecor() {
    const kind = theme.decor;
    decorClock += 0.016;

    if (kind === 'stars') {
      for (const s of decorItems) {
        const twinkle = 0.55 + 0.45 * Math.sin(decorClock * 1.5 + s.tw);
        ctx.globalAlpha = twinkle;
        ctx.fillStyle = theme.decorColor;
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      return;
    }

    if (kind === 'clouds') {
      ctx.fillStyle = theme.decorColor;
      for (const c of decorItems) {
        c.x += c.drift * 0.006;
        if (c.x > 1.2) c.x = -0.2;
        const cx = c.x * W, cy = c.y * H, s = c.s * (W * 0.05);
        ctx.beginPath();
        ctx.arc(cx, cy, s, 0, Math.PI * 2);
        ctx.arc(cx + s * 0.8, cy + s * 0.15, s * 0.75, 0, Math.PI * 2);
        ctx.arc(cx - s * 0.85, cy + s * 0.2, s * 0.65, 0, Math.PI * 2);
        ctx.arc(cx + s * 0.2, cy - s * 0.45, s * 0.6, 0, Math.PI * 2);
        ctx.fill();
      }
      return;
    }

    // embers / dust / snow: drifting particles
    ctx.fillStyle = theme.decorColor;
    for (const p of decorItems) {
      p.y += p.vy * 0.01;
      p.x += p.vx * 0.01;
      if (p.y < -0.05) p.y = 1.05;
      if (p.y > 1.05) p.y = -0.05;
      if (p.x < -0.05) p.x = 1.05;
      if (p.x > 1.05) p.x = -0.05;
      ctx.beginPath();
      ctx.arc(p.x * W, p.y * H, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---------- Helicopter ----------
  // An occasional fly-by, high above the peaks. Shoot it and it comes down;
  // whatever it lands on is finished, which makes it a gamble worth taking.
  let heli = null;
  let rotorAngle = 0;
  // the first one comes sooner so it gets discovered; after that it's rare
  let heliTimer = 60 + Math.random() * 50;

  function heliSize() { return Math.max(30, Math.min(58, W * 0.04)); }

  // Cruise just clear of the tallest peak rather than at a fixed height near
  // the top of the canvas. On a low or flat map a fixed altitude left the
  // helicopter miles above every barrel and simply unreachable; anchoring to
  // the terrain keeps the shot on the table whatever the map looks like, while
  // still passing over every hill. Craters only ever lower ground, so as a
  // round chews the map down the fly-by drifts down with it.
  function heliCruiseY() {
    let peak = H * 0.5;
    for (let x = 0; x < terrain.length; x++) if (terrain[x] < peak) peak = terrain[x];
    // clearance comfortably exceeds TANK_H, so it clears a tank sat on the peak
    const clearance = Math.max(34, H * 0.075) + Math.random() * H * 0.03;
    return Math.max(H * 0.05, peak - clearance);
  }

  // It turns back at the edges rather than leaving on the first pass, so the
  // fly-by isn't a lottery won by whoever happens to be up when it appears.
  // It always makes at least one return trip: with two players both may have
  // technically "had a turn" during a single crossing, while the one who was
  // mid-shot barely saw it. The upper bound stops it loitering through a slow
  // round.
  const HELI_MIN_LEGS = 2, HELI_MAX_LEGS = 6;

  function spawnHeli() {
    const fromLeft = Math.random() < 0.5;
    const w = heliSize();
    heli = {
      x: fromLeft ? -w : W + w,
      y: heliCruiseY(),
      dir: fromLeft ? 1 : -1,
      speed: W / (9 + Math.random() * 5),   // ~9-14s to cross, whatever the width
      vy: 0,
      falling: false,
      spin: 0,
      legs: 0,
      // whoever is aiming right now can already shoot at it; anyone mid-shot
      // cannot, and gets counted when their next turn starts
      seen: new Set(state === 'AIMING' ? [currentPlayer] : [])
    };
  }

  function heliHitBy(px, py) {
    if (!heli || heli.falling) return false;
    const w = heliSize();
    return Math.abs(px - heli.x) < w * 0.55 && Math.abs(py - heli.y) < w * 0.30;
  }

  // Landing on a tank destroys it outright; everything close by takes a big
  // blast. This is deliberately harsher than any shell in the game.
  function heliCrash(x, y) {
    const CRUSH = 26, BLAST = 74, BLAST_DMG = 80;
    for (const t of tanks) {
      if (!t.alive) continue;
      const dist = hullDistance(t, x, y);
      // Crushed only if the wreck comes down on it. Testing the horizontal
      // alone flattened a tank on a ledge far above or below the crash.
      if (dist < CRUSH) { t.hp = 0; t.alive = false; continue; }
      if (dist < BLAST) {
        t.hp -= BLAST_DMG * (1 - dist / BLAST);
        if (t.hp <= 0) { t.hp = 0; t.alive = false; }
      }
    }
    craterAt(x, y, BLAST * 0.7);
    spawnExplosionFx(x, y, BLAST, '#ffb03a');
    for (let i = 0; i < 36; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 60 + Math.random() * 200;
      particles.push({
        x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 90,
        life: 0.6 + Math.random() * 0.7, age: 0,
        color: Math.random() < 0.5 ? '#ffb03a' : '#6d7684'
      });
    }
    updateHUD();
    // A crash can kill between turns, so the round may need resolving here.
    if (state === 'AIMING') {
      if (endTurnCheckWin()) return;
      if (!tanks[currentPlayer].alive) nextTurn();
    }
  }

  // Hidden: double-click the wind readout to call one in. Wherever the readout
  // happens to be - the bar's pill above 900px, the canvas gauge below it.
  function summonHeli() {
    if (heli || state === 'GAMEOVER' || !terrain.length) return;
    spawnHeli();
    heliTimer = 120 + Math.random() * 60; // don't let a scheduled one pile in behind it
  }

  windHud.addEventListener('dblclick', summonHeli);
  canvas.addEventListener('dblclick', (e) => {
    if (hudWindVisible) return; // the gauge isn't drawn when the pill is up
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const box = windGaugeRect();
    if (x >= box.x && x <= box.x + box.w && y >= box.y && y <= box.y + box.h) summonHeli();
  });

  function updateHeli(dt) {
    rotorAngle += dt * 26;
    if (!heli) {
      if (state !== 'GAMEOVER') {
        heliTimer -= dt;
        if (heliTimer <= 0) { spawnHeli(); heliTimer = 120 + Math.random() * 60; }
      }
      return;
    }
    const w = heliSize();
    if (!heli.falling) {
      heli.x += heli.dir * heli.speed * dt;
      if (heli.x < -w * 1.5 || heli.x > W + w * 1.5) {
        heli.legs++;
        const allHadATurn = tanks.every((t, i) => !t.alive || heli.seen.has(i));
        if ((allHadATurn && heli.legs >= HELI_MIN_LEGS) || heli.legs >= HELI_MAX_LEGS) {
          heli = null;
        } else {
          // Come back in over the edge it just left, rather than reappearing on
          // the far side, at a slightly different altitude each time.
          const leftOverRight = heli.x > W;
          heli.dir = leftOverRight ? -1 : 1;
          heli.x = leftOverRight ? W + w * 1.5 : -w * 1.5;
          heli.y = heliCruiseY();
        }
      }
      return;
    }
    const x0 = heli.x, y0 = heli.y;
    heli.vy += GRAVITY * physScale * dt * 0.75;
    heli.x += heli.dir * heli.speed * 0.35 * dt;
    heli.y += heli.vy * dt;
    heli.spin += dt * (4 + heli.vy * 0.004);
    if (Math.random() < 0.6) {
      particles.push({
        x: heli.x + (Math.random() * 2 - 1) * 8, y: heli.y,
        vx: (Math.random() * 2 - 1) * 20, vy: -20 - Math.random() * 30,
        life: 0.6 + Math.random() * 0.6, age: 0,
        color: Math.random() < 0.5 ? '#59606b' : '#ff7a45'
      });
    }
    if (heli.x < -60 || heli.x > W + 60) { heli = null; return; } // fell off the map
    // Walked from where the frame started, like a shell, so a wreck falling
    // into a cliff face goes off against the face rather than on top of the
    // cliff. Offset by the 4px the airframe hangs below its centre.
    const c = firstContact(x0, y0 + 4, heli.x, heli.y + 4);
    if (!c) return;
    heli = null;
    if (c.what === 'off') return;
    heliCrash(Math.max(0, Math.min(W - 1, c.px)), c.py);
  }

  function drawHeli() {
    if (!heli) return;
    const w = heliSize(), h = w * 0.34;
    ctx.save();
    ctx.translate(heli.x, heli.y);
    if (heli.falling) ctx.rotate(heli.spin);
    ctx.scale(heli.dir, 1);

    ctx.fillStyle = heli.falling ? '#6b4a34' : '#46525f';
    ctx.beginPath();
    ctx.ellipse(0, 0, w * 0.30, h * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(-w * 0.56, -h * 0.10, w * 0.34, h * 0.20); // tail boom
    ctx.fillRect(-w * 0.60, -h * 0.60, w * 0.07, h * 0.60); // tail fin

    ctx.fillStyle = 'rgba(185,222,255,0.78)';
    ctx.beginPath();
    ctx.ellipse(w * 0.14, -h * 0.05, w * 0.10, h * 0.30, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#2b333d';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-w * 0.18, h * 0.66); ctx.lineTo(w * 0.20, h * 0.66);
    ctx.stroke();

    // rotors, drawn as a blade seen edge-on so they read as spinning
    ctx.strokeStyle = 'rgba(232,238,247,0.9)';
    ctx.lineWidth = 2;
    const blade = Math.cos(rotorAngle) * w * 0.48;
    ctx.beginPath();
    ctx.moveTo(-blade, -h * 0.78); ctx.lineTo(blade, -h * 0.78);
    ctx.moveTo(0, -h * 0.78); ctx.lineTo(0, -h * 0.5);
    ctx.stroke();
    const tail = Math.cos(rotorAngle * 1.7) * h * 0.5;
    ctx.beginPath();
    ctx.moveTo(-w * 0.58, -h * 0.30 - tail); ctx.lineTo(-w * 0.58, -h * 0.30 + tail);
    ctx.stroke();
    ctx.restore();
  }

  // Drawn detail only — TANK_W and TANK_H still define the collision box, so
  // nothing here changes how shots land or how damage is scored.
  function drawTank(t) {
    const gy = groundHeightAt(t.x);
    const w = TANK_W, h = TANK_H;
    ctx.save();
    ctx.translate(t.x, gy);

    // tracks, with road wheels showing through
    const trackH = 5, trackW = w + 4;
    ctx.fillStyle = '#26222b';
    pillPath(-trackW / 2, -trackH, trackW, trackH, 2.5);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.20)';
    for (let i = 0; i < 4; i++) {
      const x = -trackW / 2 + 4 + i * ((trackW - 8) / 3);
      ctx.beginPath();
      ctx.arc(x, -trackH / 2, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // hull, sloped front and back rather than a plain block
    ctx.fillStyle = t.color;
    ctx.beginPath();
    ctx.moveTo(-w / 2, -trackH);
    ctx.lineTo(-w / 2 + 3.5, -h + 4);
    ctx.lineTo(w / 2 - 3.5, -h + 4);
    ctx.lineTo(w / 2, -trackH);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.22)'; // shaded skirt
    ctx.fillRect(-w / 2 + 1, -trackH - 1.5, w - 2, 1.5);
    ctx.fillStyle = 'rgba(255,255,255,0.20)'; // lit deck
    ctx.fillRect(-w / 2 + 3.5, -h + 4, w - 7, 1.4);

    // turret
    ctx.fillStyle = t.color;
    ctx.beginPath();
    ctx.moveTo(-7, -h + 4);
    ctx.lineTo(-4.5, -h - 1);
    ctx.lineTo(4.5, -h - 1);
    ctx.lineTo(7, -h + 4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillRect(-4.5, -h - 1, 9, 1.2);

    // barrel: dark sleeve under a coloured core, with a muzzle brake
    const ang = t.angle * Math.PI / 180;
    const bx = Math.cos(ang), by = -Math.sin(ang);
    const py = -h + 1;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#241f29';
    ctx.lineWidth = 4.6;
    ctx.beginPath();
    ctx.moveTo(0, py); ctx.lineTo(bx * 19, py + by * 19);
    ctx.stroke();
    ctx.strokeStyle = t.color;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(0, py); ctx.lineTo(bx * 18, py + by * 18);
    ctx.stroke();
    ctx.strokeStyle = '#241f29';
    ctx.lineWidth = 4.6;
    ctx.beginPath();
    ctx.moveTo(bx * 16, py + by * 16); ctx.lineTo(bx * 20, py + by * 20);
    ctx.stroke();

    ctx.restore();
  }

  // ---------- Wind indicators ----------
  // Sky streaks drift with the wind so its direction and force are readable
  // at a glance from the playfield, not just from the number in the HUD.
  const windStreaks = [];
  for (let i = 0; i < 22; i++) {
    windStreaks.push({
      x: Math.random(),
      y: 0.04 + Math.random() * 0.6,
      len: 0.025 + Math.random() * 0.06,
      sp: 0.7 + Math.random() * 0.9,
      a: 0.25 + Math.random() * 0.45
    });
  }

  function drawWindStreaks() {
    const s = windStrength();
    if (s < 0.06) return; // dead calm — nothing to show
    const dir = wind >= 0 ? 1 : -1;
    ctx.lineCap = 'round';
    ctx.lineWidth = 1.5;
    // Speed off normalized strength, so retuning WIND_MAX doesn't change the pace.
    const drift = (wind >= 0 ? s : -s) * 190 * 0.016;
    for (const k of windStreaks) {
      k.x += drift / W * k.sp;
      if (k.x > 1.2) k.x = -0.2;
      if (k.x < -0.2) k.x = 1.2;
      const len = k.len * W * (0.35 + s * 0.9);
      ctx.strokeStyle = `rgba(${streakRGB},${(k.a * s * 0.6).toFixed(3)})`;
      ctx.beginPath();
      ctx.moveTo(k.x * W, k.y * H);
      ctx.lineTo(k.x * W - dir * len, k.y * H);
      ctx.stroke();
    }
  }

  function pillPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // A dark pill keeps the gauge legible over both the bright and dark skies.
  function windGaugeRect() {
    const w = Math.min(250, W - 24);
    return { x: (W - w) / 2, y: 10, w: w, h: 30 };
  }

  function drawWindGauge() {
    const s = windStrength();
    const col = windColor();
    const box = windGaugeRect();
    const PW = box.w, PH = box.h, px = box.x, py = box.y;
    const midY = py + PH / 2;

    ctx.save();
    pillPath(px, py, PW, PH, 6);
    ctx.fillStyle = 'rgba(12,11,16,0.62)';
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = `rgba(255,255,255,${(0.16 + windPulse * 0.55).toFixed(3)})`;
    ctx.stroke();

    ctx.textBaseline = 'middle';
    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(236,231,225,0.6)';
    ctx.fillText(txt('wind'), px + 10, midY);

    ctx.textAlign = 'right';
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillStyle = col;
    ctx.fillText(windForce() + '/10', px + PW - 10, midY);

    // Track with a centre tick, so the arrow reads as "how far from calm".
    const g0 = px + 48, g1 = px + PW - 52;
    const gc = (g0 + g1) / 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(g0, midY); ctx.lineTo(g1, midY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gc, midY - 5); ctx.lineTo(gc, midY + 5); ctx.stroke();

    if (s > 0.02) {
      const dir = wind >= 0 ? 1 : -1;
      const len = Math.max(10, s * ((g1 - g0) / 2 - 6));
      const ex = gc + dir * len;
      ctx.strokeStyle = col;
      ctx.fillStyle = col;
      ctx.lineWidth = 3 + windPulse * 1.5;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(gc, midY); ctx.lineTo(ex - dir * 5, midY); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ex, midY);
      ctx.lineTo(ex - dir * 9, midY - 6);
      ctx.lineTo(ex - dir * 9, midY + 6);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // Dashed arc from the active tank's barrel, in that player's colour, ending
  // in a ring at the predicted impact point.
  function drawAimPreview() {
    if (state !== 'AIMING') return;
    const t = tanks[currentPlayer];
    if (!t || !t.alive) return;
    const full = aimPreviewOn();
    // Everyone gets the short hint on their own turn; only Brutal shows the
    // whole arc, and only Brutal telegraphs a CPU shot.
    if (!full && isAi(currentPlayer)) return;
    if (isAi(currentPlayer) && !cpuAimReady) return;

    const a = t.angle * Math.PI / 180;
    const barrelLen = 20;
    const x0 = t.x + barrelLen * Math.cos(a);
    const y0 = groundHeightAt(t.x) - TANK_H - barrelLen * Math.sin(a);
    let pts = traceShot(x0, y0, t.angle, t.power, wind);
    if (pts.length < 2) return;
    // traceShot integrates a plain parabola. A guided shell leaves that path at
    // apex, so the preview stops there rather than promising a landing spot it
    // has no intention of using.
    const guided = WEAPONS[t.weapon] && WEAPONS[t.weapon].guides;
    if (guided) {
      let apex = pts.length;
      for (let i = 1; i < pts.length; i++) {
        if (pts[i][1] >= pts[i - 1][1]) { apex = i + 1; break; }
      }
      pts = pts.slice(0, apex);
      if (pts.length < 2) return;
    }

    ctx.save();
    if (full) {
      ctx.strokeStyle = t.color;
      ctx.lineWidth = 1.6;
      ctx.globalAlpha = 0.5;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.stroke();
      ctx.setLineDash([]);

      if (!guided) {
        const end = pts[pts.length - 1];
        ctx.globalAlpha = 0.85;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(end[0], end[1], 5, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else {
      // Roughly the first half second of flight, fading out: enough to read
      // departure angle and which way the wind is bending it, not enough to
      // hand over the landing spot.
      const SHORT = 34;
      const n = Math.min(SHORT, pts.length);
      ctx.fillStyle = t.color;
      for (let i = 2; i < n; i += 3) {
        ctx.globalAlpha = 0.5 * (1 - i / SHORT);
        ctx.beginPath();
        ctx.arc(pts[i][0], pts[i][1], 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    // sky
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, theme.skyTop);
    skyGrad.addColorStop(1, theme.skyBot);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    drawDecor();
    drawWindStreaks();

    // terrain
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x < terrain.length; x += 2) {
      ctx.lineTo(x, terrain[x]);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    const groundGrad = ctx.createLinearGradient(0, H * 0.3, 0, H);
    groundGrad.addColorStop(0, theme.ground1);
    groundGrad.addColorStop(1, theme.ground2);
    ctx.fillStyle = groundGrad;
    ctx.fill();
    ctx.strokeStyle = theme.rim;
    ctx.lineWidth = 2;
    ctx.stroke();

    // tanks
    tanks.forEach(t => { if (t.alive) drawTank(t); });

    drawHeli();
    drawAimPreview();

    // trails and shells, one set per warhead in the air
    for (const p of projectiles) {
      if (p.trail.length > 1) {
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        p.trail.forEach((pt, idx) => idx === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
        ctx.stroke();
      }
      const pw = WEAPONS[p.weapon];
      ctx.fillStyle = pw.color;
      if (p.rolling) {
        // A rolling mine reads as a spiked drum sitting on the ground, and the
        // spin direction shows which way it is travelling.
        const r = 6;
        const cy = p.y - r;
        const spin = p.x / r;
        ctx.strokeStyle = pw.color;
        ctx.lineWidth = 2;
        for (let i = 0; i < 6; i++) {
          const a = spin + i * Math.PI / 3;
          ctx.beginPath();
          ctx.moveTo(p.x + Math.cos(a) * r, cy + Math.sin(a) * r);
          ctx.lineTo(p.x + Math.cos(a) * (r + 3), cy + Math.sin(a) * (r + 3));
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(p.x, cy, r, 0, Math.PI * 2);
        ctx.fill();
      } else if (pw.guides) {
        // Pointed along its heading, so the nose-over at apex is visible, with
        // a flame out the back while the motor is lit.
        const a = Math.atan2(p.vy, p.vx);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(a);
        if (p.burnLeft > 0) {
          ctx.fillStyle = '#ffb03a';
          ctx.beginPath();
          ctx.moveTo(-5, 0);
          ctx.lineTo(-11 - Math.random() * 5, 2.2);
          ctx.lineTo(-11 - Math.random() * 5, -2.2);
          ctx.closePath();
          ctx.fill();
        }
        ctx.fillStyle = pw.color;
        ctx.beginPath();
        ctx.moveTo(7, 0);
        ctx.lineTo(-5, 3);
        ctx.lineTo(-5, -3);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      } else {
        // An unsplit MIRV is drawn fatter than the warheads it carries, and a
        // cluster bomb's bomblets smaller than the casing they came out of.
        ctx.beginPath();
        ctx.arc(p.x, p.y, pw.mirvCount && !p.split ? 6 : p.bomblet ? 3 : 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // explosions
    explosions.forEach(e => {
      const alpha = Math.max(0, 1 - e.r / e.maxR);
      const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r);
      grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
      grad.addColorStop(0.4, e.color);
      grad.addColorStop(1, 'rgba(255,80,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // particles
    particles.forEach(p => {
      const alpha = 1 - p.age / p.life;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
      ctx.globalAlpha = 1;
    });

    // Only one wind readout at a time: the bar's pill where it fits, this otherwise.
    if (!hudWindVisible) drawWindGauge();
  }

  // ---------- Boot ----------
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 150));
  // Mobile browsers resize the visual viewport when the address bar hides/shows
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  resize();
  buildInfo.textContent = BUILD;
  pruneWeaponOptions();
  initSound();
  initLanguage();
  refreshOpponentUi();
  resetGame();
  requestAnimationFrame(step);
  // iOS Safari can report stale/zero layout on first paint; re-measure shortly after.
  setTimeout(resize, 60);
  setTimeout(resize, 400);
  window.addEventListener('load', resize);

  // ---------- Test seam ----------
  // The game is one IIFE inside one file (it ships as a single self-contained
  // page), so tests/ reaches in through here to drive the physics, the AI and
  // the turn machinery directly. Nothing in the game itself reads this object.
  window.__BARRAGE_TEST__ = {
    BUILD, WEAPONS, MISSILE, DIFFICULTY_SETTINGS, GRAVITY, TANK_W, TANK_H, MAX_HP,
    WIND_MAX, MAX_PLAYERS, THEMES,
    groundHeightAt, craterAt, bedrockY, newTerrain, rebuildTerrainToWidth,
    placeTanks, levelTankPads, groundGradientAt, buildTanks,
    freshAmmo, weaponEnabled, weaponAvailable, syncWeaponOptions, pruneWeaponOptions,
    fire, applyDamageAndCrater, hullDistance, stepProjectile, stepRoller, detonateRoller, splitMirv, scatterBomblets, firstContact,
    armMissile, flyMissile, missileFuzed, predictLandingX, traceShot, step, resize,
    endTurnCheckWin, nextTurn, resetGame, maybeAiTurn, chooseAiShot, aiFireDelayMs,
    setWind, windStrength, windForce, isAi, txt, upper, playerName,
    syncControlsFromTank, updateHUD, nudge,
    heliSize, spawnHeli, heliHitBy, heliCrash, updateHeli, summonHeli,
    SOUND, Sound, setSoundOn, stopAllSound, updateSoundLoops, soundAvailable,
    setSfxLevel, sliderToLevel, levelToSlider, RELOADS, gunPanner, zonePanner, panOf, audioCtx, secondsToImpact, FLIGHT, flightOf,
